slug: systems-thinking
title: "تفکر سیستمی"
description: "مدل کوه‌یخ، حلقه‌های بازخورد، تأخیرها و نقاط اهرمی در سیستم‌های پیچیده."

default_ai_system_prompt: |
  تو «فانوس» هستی، یه راهنمای سقراطی برای آموزش تفکر سیستمی به زبان فارسی.
  مکانیزم مسیریابی این کورس با کورس‌های دیگر فرق دارد:
  کاربر بر اساس اینکه در کدام سطح از ۴ سطح کوه‌یخ پاسخ می‌دهد مسیریابی می‌شود:
  رویداد / الگو / ساختار / مدل ذهنی — هرچه عمیق‌تر، بهتر.
  قوانین سفت‌وسخت:
  - هرگز نگو پاسخ کاربر درسته یا غلطه.
  - هدف این کورس نه رد یا تأیید نتیجه‌گیری، بلکه عمق نگاه است.
  - در ۲ تا ۴ جمله، کاربر را به لایه‌ی عمیق‌تر هدایت کن.
  - لحن گرم و بدون قضاوت. فقط فارسی.

# ─────────────────────────────────────────────────────────────
# یادداشت معماری (بعد از ممیزی): app/ai_feedback.py دیگر ai_socratic_prompt
# را به‌عنوان یک اسکریپت جواب آماده نمی‌خواند. یک SOCRATIC_ENGINE_SYSTEM_PROMPT
# مشترک، قوانین رفتاری پایه (روش الِنخوس + تشخیص CoT در تگ <analysis>) را برای
# هر ۲۷ سناریو یکسان اعمال می‌کند؛ محتوای ai_socratic_prompt هر گام فقط به‌عنوان
# «یادداشتِ زمینه‌ای» (مفهومِ هدف + لایه‌ی پنهانِ مخصوصِ همین سناریو) تزریق
# می‌شود، نه متنی برای کپیِ عینی. سناریوی order:1 در logical-thinking.yaml به
# همین سبک بازنویسی شده — الگو برای بازنویسیِ تدریجیِ بقیه‌ی سناریوهاست.
# ─────────────────────────────────────────────────────────────

steps:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۱ — کوه یخ (۴ سطح دیدن)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 1
  tag: "فصل ۱ — کوه‌یخ"
  title: "چرا همه مضطرب‌اند؟"
  body: >
    کلاس یا محیط کارت را در ذهن مرور می‌کنی. هر ترم، هر فصل، همان الگو تکرار
    می‌شود — چهره‌های خسته، چشم‌های بی‌خواب، جمله‌هایی مثل «دیگه نا ندارم» که از
    این میز به آن میز رد و بدل می‌شود. یک روز، استاد یا مدیرتان، با لحنی که بیشتر
    شبیه شکایت است تا نگرانی، می‌گوید: «این نسل ضعیف‌تر شده، بچه‌ها تحملشون کم
    شده.» جمله‌ای که همه شنیده‌اند، همه تکرار کرده‌اند، و شاید خودت هم یک بار
    در دلت گفته‌ای. اما وقتی به اطرافت نگاه می‌کنی — به همکلاسی‌ای که سه شغل دارد،
    به همکاری که هر شب تا دیر وقت پیام کاری جواب می‌دهد — یک سؤال آرام در ذهنت
    شکل می‌گیرد: آیا واقعاً «آدم‌ها» عوض شده‌اند، یا چیز دیگری اینجا در حال اتفاق
    افتادن است که این توضیح ساده آن را پنهان می‌کند؟
  prompt: >
    اگر بخواهی از این توضیح ساده («آدم‌ها ضعیف شده‌اند») فراتر بروی،
    این اضطراب تکرارشونده را در چهار لایه توصیف کن:
    رویداد: دقیقاً این دوره/این محیط چه دیدی؟
    الگو: آیا این تکرار می‌شود؟
    ساختار: چه چیزی در قوانین یا فضای این محیط این وضعیت را می‌سازد؟
    مدل ذهنی: چه باوری پشت آن ساختار است؟
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد ۴ سطح کوه‌یخ را یاد می‌گیرد.
    - اگر کاربر فقط در سطح رویداد ماند («آدم‌ها ضعیف شدن»):
      «تو داری فقط نوک کوه‌یخ را توصیف می‌کنی — چیزی که دیدی، نه چیزی که آن را ساخته.
      اگر سال بعد هم همین اتفاق بیفتد، آیا هنوز می‌توان گفت ‹این نسل خاص ضعیف بود›؟»
    - اگر کاربر تا الگو رسید اما نه فراتر:
      «خوب دیدی که تکرار می‌شود. حالا سؤال سخت‌تر: چه چیزی در ساختار این محیط —
      نه در آدم‌ها — این الگو را هر سال از نو تولید می‌کند؟»
    - اگر کاربر تا ساختار یا مدل ذهنی رسید:
      «تو داری از ‹چه کسی مقصر است؟› به ‹چه چیزی این وضعیت را می‌سازد؟› حرکت می‌کنی.
      این دقیقاً قلب تفکر سیستمی است.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "مدل کوه‌یخ (Iceberg Model)"
    takeaway: >
      مدل کوه‌یخ ابزاری برای دیدن یک موقعیت در چهار عمق مختلف است. سطح «رویداد»،
      چیزی است که مستقیم می‌بینیم — «امروز همه خسته‌اند.» سطح «الگو»، تکرارِ آن
      رویداد در طول زمان است — «این هر ترم اتفاق می‌افتد.» سطح «ساختار»، قوانین،
      فشارها، و سیستم‌هایی است که آن الگو را می‌سازند — مثلاً حجم کاری غیرواقعی،
      نبود زمان استراحت، رقابت بیش‌ازحد. و سطح «مدل ذهنی»، باورهای عمیقی است که
      آن ساختار را طبیعی جلوه می‌دهند — مثلاً «موفقیت یعنی هیچ‌وقت خسته نشدن.»


      بیشتر توضیح‌های روزمره‌ی ما (مثل «این نسل ضعیف‌تره») در سطح رویداد یا حداکثر
      الگو باقی می‌مانند، و مقصر را در «آدم‌ها» جست‌وجو می‌کنند. این توضیح‌ها راحت‌اند
      چون نیازی به تغییر سیستم ندارند — کافی است افراد را سرزنش کنی. اما وقتی همان
      الگو سال‌به‌سال با آدم‌های کاملاً متفاوت تکرار می‌شود، این خودش نشانه‌ی قوی‌ای
      است که مشکل در ساختار است، نه در افراد.


      قدرت مدل کوه‌یخ این است که مسیر حل مسئله را عوض می‌کند: به‌جای «چطور آدم‌ها را
      قوی‌تر کنیم؟» می‌پرسی «چه چیزی در ساختار این محیط باید تغییر کند؟» — سؤالی که
      معمولاً به راه‌حل‌های پایدارتر می‌رسد، چون علت را هدف می‌گیرد، نه علامت را.
    exercise:
      prompt: "یک شکایت تکراری که در محیط کار یا تحصیلت زیاد می‌شنوی را انتخاب کن (مثلاً «همه بی‌انگیزه‌اند») و آن را در چهار سطح کوه‌یخ بنویس: رویداد، الگو، ساختار، مدل ذهنی."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۲ — حلقه‌های بازخورد (تقویتی / تعدیلی)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 2
  tag: "فصل ۲ — حلقه‌های بازخورد"
  title: "چرخه‌ای که خودش را تغذیه می‌کند"
  body: >
    شب امتحان است. کتاب باز جلویت است، اما ذهنت جای دیگری است. هرچه بیشتر می‌خوانی،
    بیشتر مضطرب می‌شوی — انگار هر صفحه‌ی جدید یادت می‌آورد چقدر هنوز نخوانده‌ای.
    اضطراب باعث می‌شود تمرکزت پایین بیاید؛ همان جمله را سه بار می‌خوانی بدون اینکه
    چیزی از آن بفهمی. تمرکز پایین باعث می‌شود حس کنی عقب افتاده‌ای — و این حس،
    دوباره تو را وادار می‌کند سریع‌تر و بیشتر بخوانی، این بار با تمرکزی حتی کمتر
    از قبل. ساعت از دو نیمه‌شب گذشته، چشم‌هایت می‌سوزند، و هنوز همان صفحه‌ی اول
    باز است. یک جایی از ذهنت می‌داند این چرخه دارد او را به جایی نمی‌رساند، اما
    نمی‌داند دقیقاً کجای این چرخه باید متوقفش کند.
  prompt: "این چرخه را با فلش رسم کن (با کلمه، نه لزوماً تصویر): از کجا شروع می‌شود و به کجا برمی‌گردد؟ و از نظرت، این حلقه با گذشت زمان وضعیت را بهتر می‌کند یا بدتر؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد حلقه‌ی تقویتی (Reinforcing) را کشف می‌کند.
    - اگر کاربر حلقه را ندید و فقط یک متغیر را مقصر دانست:
      «تو یک پیکان دیدی، نه یک دایره. دوباره نگاه کن: تمرکز پایین، خودش چه اتفاقی را رقم می‌زند؟»
    - اگر کاربر حلقه‌ی کامل را دید:
      «دقیقاً. حالا متوجه شدی چرا این وضعیت با گذشت زمان بدتر می‌شود، نه بهتر —
      چون خودش را تغذیه می‌کند. اما یک نوع دیگر حلقه هم هست که خودش را متعادل می‌کند،
      نه تشدید: مثلاً گرسنگی → غذا خوردن → سیری → کاهش گرسنگی. چه چیزی این دو را از هم متفاوت می‌کند؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "حلقه‌های بازخورد تقویتی و تعدیلی (Reinforcing & Balancing Loops)"
    takeaway: >
      در تفکر سیستمی، رابطه‌های علّی به‌جای یک خط مستقیم، اغلب یک دایره‌اند: A باعث B
      می‌شود، B باعث C می‌شود، و C دوباره روی A اثر می‌گذارد. حلقه‌ی تقویتی (Reinforcing
      Loop) دایره‌ای است که هر دور، اثرش را بزرگ‌تر می‌کند — مثل اضطراب که تمرکز را
      کم می‌کند، و تمرکز کم که اضطراب را بیشتر می‌کند. این نوع حلقه‌ها، اگر بدون
      مداخله رها شوند، می‌توانند بدون هیچ محدودیت طبیعی، وضعیت را به سمت بدتر و بدتر
      شدن ببرند.


      در مقابل، حلقه‌ی تعدیلی (Balancing Loop) دایره‌ای است که خودش را متعادل می‌کند
      — مثل گرسنگی که باعث غذا خوردن می‌شود، غذا خوردن باعث سیری می‌شود، و سیری
      گرسنگی را کم می‌کند. این نوع حلقه، سیستم را به سمت یک نقطه‌ی تعادل می‌برد، نه
      به سمت افراط.


      مهارت اصلی تفکر سیستمی، توانایی دیدن این دایره‌هاست، نه فقط خط‌های مستقیم.
      وقتی فقط یک عاملِ مقصر می‌بینی («من مضطربم چون درسم زیاده»)، راه‌حلت هم سطحی
      می‌ماند. اما وقتی حلقه را کامل می‌بینی، متوجه می‌شوی که می‌توانی از هر نقطه‌ای
      از دایره وارد شوی و آن را متوقف کنی — مثلاً نه با «بیشتر خواندن»، بلکه با
      شکستن حلقه از نقطه‌ی «تمرکز پایین»، از طریق یک استراحت کوتاه.
    exercise:
      prompt: "یک عادت یا حالت روحی تکرارشونده در زندگی‌ات را انتخاب کن که حس می‌کنی «خودش را تغذیه می‌کند». آن را به‌صورت یک حلقه با فلش بنویس — از کجا شروع می‌شود و به کجا برمی‌گردد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۳ — پیامدهای ناخواسته (راه‌حل‌های سطحی)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 3
  tag: "فصل ۳ — پیامدهای ناخواسته"
  title: "راه‌حلی که مشکل جدید ساخت"
  body: >
    مدیریت شرکت یا دانشگاه، نگران افت عملکرد افراد، تصمیم می‌گیرد کاری «قاطع» انجام
    دهد: تعداد ارزیابی‌ها و گزارش‌دهی‌های هفتگی را دو برابر می‌کند. در جلسه‌ی اعلام
    این تصمیم، مدیر با اطمینان می‌گوید: «این‌طوری همه مسئولیت‌پذیرتر می‌شن.» چند ماه
    می‌گذرد. نتیجه دقیقاً برعکس چیزی است که انتظار می‌رفت: استرس افراد بالا رفته،
    چون وقت کمتری برای عمیق‌شدن در کار واقعی مانده و بیشترش صرف پرکردن فرم و گزارش
    می‌شود؛ یادگیری سطحی‌تر شده، چون کسی فرصت تمرکز طولانی روی یک موضوع را ندارد؛
    و عجیب‌تر از همه، تخلف و گزارش‌دهی نادرست هم افزایش یافته — چون افراد برای
    اینکه در ارزیابی‌های مکرر خوب به نظر برسند، شروع کرده‌اند به میان‌بر زدن.
  prompt: "راه‌حل (ارزیابی بیشتر) دقیقاً برای حل چه مشکلی طراحی شده بود؟ و چرا فکر می‌کنی نتیجه‌ی برعکس داد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد می‌فهمد که راه‌حل‌های سطحی چطور مشکل جدید می‌سازند.
    - اگر کاربر فقط گفت «تصمیم بدی بود»:
      «‹بد بودن› یک قضاوت است، نه یک تحلیل. چه چیزی در ساختار این راه‌حل بود که باعث شد اثر برعکس بگذارد؟»
    - اگر کاربر رابطه‌ی علّی را دید:
      «دقیقاً. راه‌حل، آن چیزی را که قرار بود کاهش دهد، عملاً از یک مسیر دیگر تقویت کرد.
      اگر این سازمان به‌جای افزایش تعداد ارزیابی، سراغ ریشه رفته بود، راه‌حل چه شکل دیگری پیدا می‌کرد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "پیامدهای ناخواسته (Unintended Consequences)"
    takeaway: >
      در سیستم‌های پیچیده، هر مداخله فقط روی متغیری که هدف گرفته اثر نمی‌گذارد،
      بلکه روی کل شبکه‌ی به‌هم‌مرتبطِ متغیرهای دیگر هم اثر می‌گذارد — و بعضی از این
      اثرها، دقیقاً خلاف چیزی هستند که برنامه‌ریزی شده بود. افزایش ارزیابی‌ها برای
      «افزایش مسئولیت‌پذیری» طراحی شده بود، اما چون زمان و انرژی افراد ثابت است،
      این افزایش، زمانِ کار عمیق را خورد و استرس و میان‌بر زدن را جایگزینش کرد.


      این پدیده معمولاً از یک اشتباه ساده سرچشمه می‌گیرد: نگاه‌کردن به یک متغیر
      به‌تنهایی، بدون در نظر گرفتن اینکه آن متغیر در یک شبکه از رابطه‌ها زندگی می‌کند.
      راه‌حل‌های سطحی («بیشتر نظارت کن»، «سخت‌تر بگیر») معمولاً چون سریع و قابل‌اندازه‌گیری
      هستند جذاب به نظر می‌رسند، اما دقیقاً همین سادگی‌شان است که باعث می‌شود اثرات
      جانبی‌شان دیده نشود.


      سؤال مهمی که پیش از هر مداخله باید پرسید این است: «این تغییر، چه چیز دیگری در
      سیستم را هم تحت تأثیر قرار می‌دهد؟» جواب این سؤال همیشه قابل‌پیش‌بینی نیست،
      اما فقط پرسیدنش، احتمال غافلگیرشدن از یک پیامد ناخواسته را به‌شدت کم می‌کند.
    exercise:
      prompt: "یک قانون یا تصمیمی (در خانه، محل کار، یا حتی برای خودت) به یاد بیاور که برای حل یک مشکل گذاشته شد، اما یک اثر جانبیِ ناخواسته هم داشت. آن اثر جانبی دقیقاً از کجا آمد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۴ — تأخیرها (Delay)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 4
  tag: "فصل ۴ — تأخیرها"
  title: "نتیجه‌ای که هنوز نرسیده"
  body: >
    دو هفته پیش، با انگیزه‌ای بالا تصمیم گرفتی منظم ورزش کنی. هر روز صبح زود بیدار
    شدی، برنامه‌ات را دنبال کردی، حتی چند روزی که خسته بودی هم کوتاه نیامدی. امروز،
    جلوی آینه ایستاده‌ای و دنبال تغییری در بدنت می‌گردی — چیزی که نشان بدهد این
    همه زحمت بی‌فایده نبوده. اما هیچ چیز محسوسی نمی‌بینی؛ همان بدن دو هفته پیش،
    شاید کمی خسته‌تر. یک صدای آرام در ذهنت شروع می‌کند به وسوسه‌کردنت: «شاید این
    برنامه برای بدن تو جواب نمی‌ده»، «شاید داری وقتت رو تلف می‌کنی.» دستت می‌رود
    سمت گوشی، آماده‌ای برنامه‌ی بعدی، جدیدتر، را جست‌وجو کنی — همان‌طور که بارها
    قبل از این هم این کار را کرده‌ای.
  prompt: "نبود نتیجه در این دو هفته، دقیقاً به چه معناست؟ آیا ورزش کار نمی‌کند، یا هنوز وقت کافی برای دیده‌شدن نتیجه نگذشته؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد مفهوم Delay را از طریق تجربه کشف می‌کند.
    - اگر کاربر نبود نتیجه را مساوی شکست دانست:
      «تو داری با معیار زمانی اشتباهی قضاوت می‌کنی. سیستم بدن، بازخوردش را فوری نمی‌دهد —
      این یعنی نبود سیگنال، دلیل کافی برای رها کردن نیست.
      چه تصمیم‌های دیگری در زندگیات هستند که نتیجه‌شان دیر می‌رسد و ممکن است زودتر از موعد رهایشان کنی؟»
    - اگر کاربر تأخیر را در نظر گرفت:
      «درست است. در نبود بازخورد فوری، چطور می‌توانی مطمئن شوی داری مسیر درست را می‌روی؟
      چرا فکر می‌کنی سیستم‌های بیولوژیک و اجتماعی معمولاً تأخیر دارند، نه واکنش آنی؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تأخیر در سیستم (Delay)"
    takeaway: >
      بسیاری از سیستم‌های واقعی — بدن انسان، روابط، سازمان‌ها، اقتصاد — بین «اقدام»
      و «نتیجه‌ی قابل‌مشاهده» یک فاصله‌ی زمانی دارند که به آن «تأخیر» می‌گویند. این
      تأخیر یعنی نبود نتیجه‌ی فوری، هیچ اطلاعاتی درباره‌ی درستی یا نادرستیِ مسیرِ تو
      نمی‌دهد — چون سیستم هنوز فرصت نکرده واکنشش را نشان دهد.


      خطر بزرگ تأخیر این است که مغز ما عادت دارد بازخورد فوری را با اعتبار مسیر یکی
      بگیرد. وقتی دو هفته ورزش می‌کنی و چیزی نمی‌بینی، به‌طور طبیعی نتیجه می‌گیری
      «این کار نمی‌کند» — درحالی‌که واقعیت این است که تغییرات فیزیولوژیک قابل‌مشاهده
      معمولاً هفته‌ها تا ماه‌ها زمان می‌برند. این سوءتفاهم بین بدن مردم را وادار
      می‌کند دقیقاً همان لحظه‌ای که به نتیجه نزدیک شده‌اند، رها کنند.


      راه مقابله با این تله این نیست که کورکورانه به هر مسیری ادامه دهی، بلکه این
      است که پیش از شروع، بپرسی: «برای این نوع تغییر، معمولاً چقدر طول می‌کشد تا
      نتیجه دیده شود؟» و معیار قضاوتت را بر اساس آن زمان‌بندی واقعی تنظیم کنی، نه
      بر اساس بی‌صبریِ لحظه‌ای.
    exercise:
      prompt: "یک تلاش اخیر (ورزش، یادگیری زبان، تغییر عادت) را به یاد بیاور که به‌خاطر نبود نتیجه‌ی سریع، زودتر از موقع رهایش کردی. اگر می‌دانستی نتیجه‌اش معمولاً چقدر طول می‌کشد، تصمیمت فرق می‌کرد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۵ — انتقال بار (Shifting the Burden)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 5
  tag: "فصل ۵ — انتقال بار"
  title: "تسکین سریع، وابستگی آهسته"
  body: >
    یک روز شلوغ و پراضطراب. هرچند دقیقه یک‌بار، بدون اینکه حتی خودت متوجه شوی،
    دستت می‌رود سمت گوشی و شبکه‌ی اجتماعی را چک می‌کنی. برای چند دقیقه، ذهنت از
    اضطراب فاصله می‌گیرد، غرق می‌شود در ویدیوهای کوتاه و پست‌های بی‌ربط. حس می‌کنی
    کمی آرام شده‌ای — همین کافی است تا دوباره برگردی سراغ کاری که باید انجام می‌دادی.
    اما چند دقیقه بعد، اضطراب دوباره سر می‌رسد، شاید حتی کمی قوی‌تر از قبل. دوباره
    همان مسیر: گوشی، اسکرول، آرامش موقت. تا شب، فهمیده‌ای که ده‌ها بار همین چرخه
    را تکرار کرده‌ای، و مسئله‌ای که از صبح اذیتت می‌کرد، هنوز دست‌نخورده همان‌جاست
    — فقط این بار، عادتِ چک‌کردن گوشی‌ات هم قوی‌تر شده.
  prompt: "چک کردن شبکه‌ی اجتماعی، دارد کدام یک را درمان می‌کند: خود اضطراب، یا فقط علامت آنی‌اش؟ و اگر فقط علامت است، چه اتفاقی در بلندمدت می‌افتد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Shifting the Burden را کشف می‌کند — تفاوت درمان علامت
    و درمان علت.
    - اگر کاربر فقط تسکین کوتاه‌مدت را دید:
      «درست است که آرام می‌شوی، اما این آرامش دارد چه چیزی را از تو پنهان می‌کند؟»
    - اگر کاربر تشخیص داد که این راه‌حل سطحی و وابسته‌کننده است:
      «دقیقاً. تو داری علامت را درمان می‌کنی، نه علت را — و این خودش یک حلقه‌ی جدید (وابستگی) می‌سازد.
      اگر به‌جای چک کردن گوشی، هر بار می‌پرسیدی ‹این اضطراب از کجا می‌آید؟›،
      این عادت با گذشت زمان چه فرقی با عادت فعلی‌ات می‌کرد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "انتقال بار به راه‌حل موقت (Shifting the Burden)"
    takeaway: >
      این الگو زمانی رخ می‌دهد که برای یک مشکل، به‌جای رفتن سراغ علتِ اصلی، از یک
      راه‌حلِ سریع و موقت استفاده می‌کنیم که فقط علامت را تسکین می‌دهد. چک‌کردن گوشی
      وقتی مضطربی، اضطراب را حل نمی‌کند، فقط برای چند دقیقه توجهت را از آن منحرف
      می‌کند — و مشکل اصلی، دست‌نخورده، منتظرت می‌ماند تا برگردی.


      خطرناک‌ترین بخش این الگو، ساختن یک حلقه‌ی جدید است: چون راه‌حل موقت راحت و
      سریع است، هر بار که علامت (اضطراب) سر می‌رسد، به همان راه‌حل موقت پناه می‌بریم
      — و هر بار این کار را می‌کنیم، توانایی و انگیزه‌مان برای رفتن سراغ علتِ اصلی
      کمی بیشتر ضعیف می‌شود. با گذشت زمان، وابستگی به راه‌حل موقت بیشتر می‌شود،
      درحالی‌که مشکل اصلی همچنان حل‌نشده باقی می‌ماند یا حتی بدتر می‌شود.


      راه تشخیص این الگو، پرسیدن یک سؤال ساده است: «این کاری که دارم می‌کنم، دارد
      علتِ مشکل را برطرف می‌کند، یا فقط برای چند دقیقه حسِ بد را کم می‌کند؟» جواب
      صادقانه به این سؤال، معمولاً مشخص می‌کند آیا داری واقعاً پیش می‌روی یا فقط
      داری زمان می‌خری — و هر بار این خرید، کمی گران‌تر می‌شود.
    exercise:
      prompt: "یک عادتِ «تسکین سریع» در زندگی‌ات را شناسایی کن (گوشی، خوراکی، خرید، هر چیزی) که وقتی حال بدی داری سراغش می‌روی. مشکل واقعی‌ای که این عادت دارد از آن فرار می‌کند، چیست؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۶ — نقاط اهرمی (Leverage Points)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 6
  tag: "فصل ۶ — نقاط اهرمی"
  title: "کجا فشار بدهیم؟"
  body: >
    در یک جلسه نشسته‌ای — شاید در محل کارت، شاید در یک انجمن دانشجویی — و بحث
    داغ است: چطور می‌شود فرهنگ مطالعه و یادگیری را در این محیط بهبود داد؟ کسی
    پیشنهاد می‌دهد کتاب رایگان پخش کنند. یکی دیگر می‌گوید باید تبلیغات تشویقی
    راه بیندازند، پوستر بزنند، پیام انگیزشی بفرستند. صدای سومی از ته اتاق می‌آید:
    «اینا همش قبلاً امتحان شده و اثری نداشته.» او پیشنهاد می‌دهد سیستم ارزیابی و
    پاداش‌دهی را عوض کنند — طوری که یادگیری واقعی، نه فقط نمره، ارزش‌گذاری شود.
    نفر چهارم، آرام‌تر، می‌گوید مشکل عمیق‌تر از این‌هاست: باید کاری کرد باورِ
    مشترکِ افراد درباره‌ی یادگیری عوض شود — از «یادگیری یعنی زجر کشیدن برای نمره»
    به چیزی دیگر. حالا نوبت توست تصمیم بگیری کدام مسیر را حمایت کنی.
  prompt: "کدام یک از این چهار گزینه را انتخاب می‌کنی، و فکر می‌کنی چرا این یکی اثر بیشتری نسبت به بقیه دارد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد نقاط اهرمی (Leverage Points) را در کوه‌یخ پیدا می‌کند.
    - اگر کاربر گزینه‌های سطحی را انتخاب کرد (کتاب رایگان، تبلیغات):
      «این‌ها معمولاً اثر کوتاه‌مدت و محدود دارند، چون رویدادها یا رفتار را هدف می‌گیرند،
      نه ساختار یا باور. چرا فکر می‌کنی این‌ها به‌تنهایی کافی نیستند؟»
    - اگر کاربر سیستم ارزیابی یا باورها را انتخاب کرد:
      «تو داری سراغ لایه‌های عمیق‌تر کوه‌یخ می‌روی — ساختار و مدل ذهنی.
      اینجاست که کوچک‌ترین تغییر، بزرگ‌ترین اثر را دارد.
      چرا فکر می‌کنی تغییر یک قانون می‌تواند اثر بیشتری از صدها پوستر و کمپین تبلیغاتی داشته باشد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "نقاط اهرمی (Leverage Points)"
    takeaway: >
      در هر سیستم پیچیده، همه‌ی نقاط مداخله اثر یکسانی ندارند. برخی نقاط — مثل
      پخش کتاب رایگان یا کمپین تبلیغاتی — سطحی هستند: روی «رویدادها» یا «رفتار
      لحظه‌ای» اثر می‌گذارند، اما چون ریشه‌ی سیستم را دست‌نخورده می‌گذارند، اثرشان
      زودگذر است. برخی نقاط دیگر — مثل تغییر سیستم ارزیابی و پاداش، یا تغییر باور
      مشترک افراد — عمیق‌تر هستند: روی «ساختار» یا «مدل ذهنی» اثر می‌گذارند، و
      همین باعث می‌شود کوچک‌ترین تغییر در آن‌ها، اثر بزرگ و پایدار در کل سیستم بگذارد.


      این ایده را دانا میدوز، یکی از پیشگامان تفکر سیستمی، «نقطه‌ی اهرم» نامید —
      جایی که فشار دادن روی آن، بازدهی نامتناسبی نسبت به تلاشت به تو می‌دهد. تغییر
      یک قانون یا یک سیستم پاداش‌دهی، معمولاً از صدها کمپین تبلیغاتی مؤثرتر است،
      چون رفتار روزمره‌ی همه را، بدون نیاز به قانع‌کردنِ تک‌تکِ افراد، به‌طور خودکار
      در یک مسیر جدید هدایت می‌کند.


      چالش این است که نقاط اهرمیِ عمیق‌تر، معمولاً سخت‌تر، کندتر، و گاهی سیاسی‌تر از
      راه‌حل‌های سطحی هستند — به همین دلیل، اغلب افراد و سازمان‌ها به‌جای آن‌ها، به
      سراغ راه‌حل‌های سریع و قابل‌مشاهده می‌روند، حتی اگر می‌دانند اثرشان کوتاه‌مدت است.
    exercise:
      prompt: "یک مشکل تکراری در محیط اطراف خودت (خانواده، کار، دوستان) را انتخاب کن و برایش هم یک راه‌حل سطحی و هم یک راه‌حل عمیق‌تر (روی ساختار یا باور) پیشنهاد بده."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۷ — سیستم خود من (تحلیل شخصی)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 7
  tag: "فصل ۷ — سیستم خود من"
  title: "نقشه‌ی حلقه‌ی من"
  body: >
    فانوس این بار داستانی روایت نمی‌کند. صفحه ساکت و خالی است، فقط یک سؤال مستقیم
    روبه‌رویت. باید یک الگوی تکرارشونده از زندگی خودت را پیدا کنی — چیزی که بارها
    دیده‌ای اما شاید تا حالا هیچ‌وقت آن را به‌عنوان یک «سیستم» نگاه نکرده بودی.
    شاید در کار باشد، شاید در یک رابطه، شاید در سلامتی‌ات. چند لحظه مکث می‌کنی،
    چند الگو در ذهنت رژه می‌روند — و بالاخره یکی را انتخاب می‌کنی، همانی که
    بیشترین سنگینی را روی سینه‌ات می‌گذارد.
  prompt: >
    یک الگوی تکرارشونده در زندگی خودت را انتخاب کن
    (می‌تواند در کار، روابط، سلامت، یا هر حوزه‌ی دیگر باشد).
    سپس چهار سؤال را جواب بده:
    ۱. این الگو دقیقاً چیست؟
       (مثال: خستگی → فرار به گوشی → عذاب وجدان → اضطراب → خستگی بیشتر)
    ۲. این یک حلقه‌ی تقویتی است یا تعدیلی؟
    ۳. کدام قسمت این حلقه تأخیر دارد (نتیجه‌اش دیر دیده می‌شود)؟
    ۴. اگر بخواهی فقط در یک نقطه مداخله کنی، کجا بیشترین اثر را دارد؟
  ai_socratic_prompt: |
    تو «فانوس» هستی. این مأموریت شخصی‌ترین گام کورس است — کاربر دارد همه‌ی ابزارها را
    روی زندگی واقعی خودش به‌کار می‌برد.
    بازخورد ترکیبی بده (نه مسیریابی دوگانه):
    - اگر حلقه را درست ترسیم کرد اما نقطه‌ی مداخله نزدیک به رویداد بود:
      «تو حلقه را درست ترسیم کردی — این خودش یک قدم بزرگ است.
      اما نقطه‌ی مداخله‌ای که انتخاب کردی، نزدیک به رویداد است، نه نزدیک به ریشه.
      یک بار دیگر نگاه کن: کدام حلقه دارد این الگو را از اول تولید می‌کند؟»
    - اگر به نقطه‌ی عمیق‌تر رسید:
      «تو داری از ‹چه کنم؟› به ‹چه چیزی این را می‌سازد؟› حرکت می‌کنی.
      دیدن سیستم خودت، اولین قدم مداخله است — نه راه‌حل، بلکه پیش‌نیاز راه‌حل.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "کاربرد شخصی تفکر سیستمی (Personal Systems Mapping)"
    takeaway: >
      همه‌ی ابزارهایی که تا اینجا یاد گرفتی — کوه‌یخ، حلقه‌های بازخورد، تأخیر، انتقال
      بار — تا وقتی روی موقعیت‌های دیگران به‌کار می‌روند، نسبتاً آسان‌اند. سخت‌ترین
      و مفیدترین کاربردشان، وقتی است که آن‌ها را روی خودِ زندگی‌ات پیاده می‌کنی،
      چون این بار نمی‌توانی از بیرون و بی‌طرفانه نگاه کنی — خودت هم بخشی از همان
      حلقه‌ای هستی که داری تحلیلش می‌کنی.


      دشواری اصلی این تمرین این است که وقتی الگوی خودمان را می‌بینیم، وسوسه می‌شویم
      نزدیک‌ترین نقطه به «رویداد» را برای مداخله انتخاب کنیم — چون آسان‌تر و سریع‌تر
      به نظر می‌رسد. مثلاً به‌جای پرسیدن «چرا اصلاً به گوشی پناه می‌برم؟»، فقط
      تصمیم می‌گیریم «کمتر گوشی دست بگیرم» — که معمولاً چون ریشه را دست‌نخورده
      می‌گذارد، دوام نمی‌آورد.


      دیدن سیستمِ خودت، به‌تنهایی یک راه‌حل نیست، اما پیش‌نیاز هر راه‌حل پایدار است.
      وقتی می‌توانی حلقه‌ی خودت را روی کاغذ ببینی — نه فقط احساس کنی — برای اولین
      بار می‌توانی آگاهانه انتخاب کنی از کدام نقطه وارد شوی، به‌جای اینکه هر بار
      ناخودآگاه همان مسیر همیشگی را تکرار کنی.
    exercise:
      prompt: "نقشه‌ی حلقه‌ای که همین الان کشیدی را نگه دار. یک هفته‌ی دیگر، دوباره به آن نگاه کن و ببین آیا نقطه‌ی مداخله‌ای که انتخاب کرده بودی را واقعاً امتحان کردی یا نه."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # پرونده‌ی نهایی — جمع‌بند کل کورس
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 8
  tag: "پرونده‌ی نهایی — تفکر سیستمی"
  title: "خوابگاه شماره‌ی ۳"
  body: >
    هر سال، در یک محیط مشخص — خوابگاه، دفتر کار، یک تیم — همان داستان از نو تکرار
    می‌شود. افراد ناراضی‌اند، تعارض روی تعارض تلنبار می‌شود، کیفیت کار یا زندگی
    مشترک افت می‌کند. مسئولان، پشت درهای بسته، می‌گویند «این آدم‌ها همکاری بلد
    نیستند.» افراد، در گفت‌وگوهای خصوصی‌شان، می‌گویند «مسئولان اصلاً به حرفمون گوش
    نمی‌دن.» هر دو طرف مطمئن‌اند مقصر طرف مقابل است، و هر سال، وقتی گروه جدیدی از
    افراد وارد همان محیط می‌شود، طی چند ماه دوباره همان تنش از صفر شکل می‌گیرد —
    انگار خودِ فضا، نه آدم‌هایش، دارد این الگو را تولید می‌کند.
  prompt: >
    فانوس این بار پنج کار را از تو می‌خواهد، بدون راهنمایی گام‌به‌گام:
    ۱. رویدادهای این وضعیت را شناسایی کن.
    ۲. الگوهای تکرارشونده را پیدا کن.
    ۳. حلقه(های) بازخورد را ترسیم کن.
    ۴. تأخیرهای احتمالی را کشف کن.
    ۵. یک یا چند نقطه‌ی اهرمی پیشنهاد بده.
    پنج مرحله را بدون راهنمایی انجام بده. خودت مسیر تحلیل را پیدا کن.
  ai_socratic_prompt: |
    تو «فانوس» هستی و این مأموریت جمع‌بند کل کورس است — کاربر باید کوه‌یخ، حلقه‌های بازخورد،
    تأخیرها، انتقال بار، و نقاط اهرمی را با هم به‌کار ببرد.
    ارزیابی کیفی چندبخشی بده (نه مسیریابی دوگانه):
    - اگر در شناسایی رویدادها خوب بود اما هنوز دنبال مقصر می‌گشت:
      «تو در شناسایی رویدادها خوب عمل کردی. اما وقتی به سراغ حلقه رفتی،
      هنوز دنبال مقصر می‌گشتی به‌جای دیدن اینکه چطور بی‌اعتمادی دو طرف خودش را تغذیه می‌کند —
      هرچه مسئولان کمتر واکنش نشان دهند، افراد کمتر گزارش می‌دهند، کیفیت بدتر می‌شود،
      و بی‌اعتمادی بیشتر. پیشنهاد می‌کنیم فصل‌های ۲ و ۴ را یک بار دیگر مرور کنی.»
    - اگر همه‌ی لایه‌ها را با هم دید:
      «تو رویداد، الگو، حلقه‌ی بازخورد، تأخیر، و نقطه‌ی اهرمی را با هم دیدی.
      این دقیقاً همان چیزی است که یک تحلیل سیستمی واقعی را از یک توصیف ساده جدا می‌کند.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۳ تا ۵ جمله.
  lesson:
    concept_name: "تحلیل سیستمی یکپارچه (Integrated Systems Analysis)"
    takeaway: >
      شش ابزاری که در این کورس یاد گرفتی — کوه‌یخ، حلقه‌های تقویتی و تعدیلی،
      پیامدهای ناخواسته، تأخیر، انتقال بار، و نقاط اهرمی — هرکدام به‌تنهایی یک عینک
      متفاوت برای نگاه به یک موقعیت هستند. قدرت واقعی تفکر سیستمی وقتی آشکار می‌شود
      که این عینک‌ها را همزمان روی یک وضعیت پیچیده و واقعی بگذاری، نه یک‌به‌یک و جدا.


      بزرگ‌ترین مانع در تحلیل‌های واقعی، وسوسه‌ی برگشتن به تفکر «مقصر محور» است —
      حتی بعد از یاد گرفتن ابزارهای سیستمی. وقتی دو گروه (مثل مسئولان و ساکنان یک
      خوابگاه) هر دو معتقدند مشکل از طرف مقابل است، هر دو دارند در واقع توصیف یک
      حلقه‌ی واحد را می‌کنند، فقط از دو زاویه‌ی متفاوت — و تا وقتی کسی حلقه را به‌جای
      دو طرفِ آن ببیند، این الگو هر سال، با آدم‌های جدید، از نو تکرار می‌شود.


      تفکر سیستمی به تو یاد نمی‌دهد چه کسی «حق» دارد. یاد می‌دهد چطور از سؤال
      «مقصر کیست؟» به سؤال «این وضعیت را چه چیزی می‌سازد و از کجا می‌توان واردش
      شد؟» حرکت کنی — سؤالی که، برخلاف اولی، واقعاً به تغییر ختم می‌شود.
    exercise:
      prompt: "یک تعارض تکرارشونده بین دو گروه یا دو نفر در زندگی‌ات (نه لزوماً خودت) را انتخاب کن و همان پنج مرحله‌ی این پرونده — رویداد، الگو، حلقه، تأخیر، نقطه‌ی اهرمی — را رویش پیاده کن، بدون اینکه طرف هیچ‌کدام از دو طرف را بگیری."
