slug: logical-thinking
title: "تفکر منطقی"
description: "پایه‌ی استدلال درست — از تشخیص مغالطه تا ساخت برهان محکم."

default_ai_system_prompt: |
  تو «فانوس» هستی، یه راهنمای سقراطی برای آموزش تفکر منطقی به زبان فارسی.
  قوانین سفت‌وسخت:
  - هرگز نگو پاسخ کاربر درسته یا غلطه.
  - هرگز جواب آماده یا نصیحت مستقیم نده.
  - در ۲ تا ۴ جمله‌ی کوتاه، ساختار استدلال کاربر را آینه‌وار بازتاب بده و یک سؤال سقراطی بپرس.
  - لحن گرم و بدون قضاوت. فقط فارسی.

# ─────────────────────────────────────────────────────────────
# یادداشت معماری (بعد از ممیزی): app/ai_feedback.py دیگر ai_socratic_prompt
# را به‌عنوان یک اسکریپت جواب آماده نمی‌خواند. یک SOCRATIC_ENGINE_SYSTEM_PROMPT
# مشترک، قوانین رفتاری پایه (روش الِنخوس + تشخیص CoT در تگ <analysis>) را برای
# هر ۲۷ سناریو یکسان اعمال می‌کند؛ محتوای ai_socratic_prompt هر گام فقط به‌عنوان
# «یادداشتِ زمینه‌ای» (مفهومِ هدف + لایه‌ی پنهانِ مخصوصِ همین سناریو) تزریق
# می‌شود، نه متنی برای کپیِ عینی. سناریوی order:1 در logical-thinking.yaml به
# همین سبک بازنویسی شده — الگو برای بازنویسیِ تدریجیِ بقیه‌ی سناریوهاست.
# ─────────────────────────────────────────────────────────────

steps:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۱ — فروتنی شناختی (Sunk Cost Fallacy)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 1
  tag: "ماژول ۱ — فروتنی شناختی"
  title: "قبل از اینکه ماشینش را بفروشد"
  body: >
    دو سال است تو و نزدیک‌ترین دوستت دارید یک فروشگاه آنلاین را روی پا نگه می‌دارید. بخشی از سرمایه‌ی اولش از فروش طلاهای همسرش تأمین شده بود — چیزی که هیچ‌وقت بلند نگفته، اما هر دو می‌دانید. حالا، بعد از دو سال، درآمد ماهانه هنوز کمتر از هزینه‌ی سرورهاست. دوستت لپ‌تاپش را می‌چرخاند سمت تو، یک فایل اکسل باز است: «اگه ماشینم رو بفروشم، پونصد میلیون میره رو تبلیغات، تا شب عید دووم میاریم. اگه الان جمعش کنیم، دو سال زندگیمون شد هیچ، بعد باید جلوی بابام و داداشات که از اول گفتن این کار جواب نمی‌ده چی بگم؟» صدایش نه از هیجان، از یک‌جور التماسِ آرام می‌لرزد. چند ثانیه هیچ‌کدام حرف نمی‌زنید؛ فقط صدای فن لپ‌تاپ توی سکوت اتاق شنیده می‌شود.
  prompt: "تصمیم تو در این لحظه چیست و با چه استدلالی به دوستت جواب می‌دهی؟ (در یک یا دو جمله بنویس)"
  ai_socratic_prompt: |
    یادداشتِ زمینه‌ای این ایستگاه (فقط راهنما، نه متنِ آماده برای کپی):
    مفهومِ هدف: مغالطه‌ی هزینه‌ی هدررفته (Sunk Cost Fallacy).
    لایه‌ی سطحی که اکثر کاربران می‌بینند: «دو سال زمان گذاشتیم، پس نباید ول کنیم.»
    لایه‌ی پنهان‌تر که مخصوصِ این سناریوست و اکثر کاربران نمی‌بینند: ترس از قضاوتِ
    خانواده و بی‌آبرویی جلوی پدر/برادرها — یعنی ادامه‌دادن، کمتر برای نجاتِ کسب‌وکار
    و بیشتر برای اجتناب از اعترافِ «شکست خوردیم» است. اگر کاربر فقط با منطقِ مالی/ریسک
    استدلال کرد، لایه‌ی آبرو را ندیده. اگر فقط با «حیف دو سال زحمت» استدلال کرد، باز
    همان مغالطه را با کلمات دیگر تکرار کرده. مفهومِ کمکی برای پرسش پایانی: خروجِ
    بی‌شرمانه از یک تصمیمِ مرده (Guilt-free Exit) — این‌که نگه‌داشتنِ یک پروژه‌ی
    شکست‌خورده، گاهی نه از امید، بلکه از نداشتنِ جرأتِ اعلامِ شکست است.
  lesson:
    concept_name: "مغالطه‌ی هزینه‌ی هدررفته (Sunk Cost Fallacy)"
    takeaway: >
      مغالطه‌ی هزینه‌ی هدررفته زمانی رخ می‌دهد که تصمیمی درباره‌ی آینده را بر اساس
      منابعی می‌گیریم که در گذشته صرف کرده‌ایم — زمان، پول، انرژی — درحالی‌که آن منابع
      دیگر برنمی‌گردند، چه ادامه بدهیم چه ندهیم. «دو سال از عمرمون رو گذاشتیم» یک
      واقعیت است، اما یک دلیلِ منطقی برای «پس باید ماشینش را هم بفروشیم» نیست، چون
      هیچ ربط علّی‌ای بین زمانِ گذشته‌ی صرف‌شده و احتمالِ موفقیتِ آینده وجود ندارد.


      مغز ما به این تله می‌افتد چون تصمیم به توقف، به‌طور ضمنی به معنای «آن دو سال
      تلف شد» است — و پذیرفتن این حس، از نظر روانی دردناک است. اما در بسیاری از
      تصمیم‌های واقعی زندگی، این درد فقط درباره‌ی زمانِ ازدست‌رفته نیست؛ درباره‌ی
      این است که توقف‌کردن یعنی به آدم‌های دورت اعلام کنی «حق با شما بود، من اشتباه
      کردم.» گاهی ادامه‌دادنِ یک تصمیمِ مرده، کمتر برای نجاتِ آن تصمیم و بیشتر برای
      فرار از این اعتراف است.


      سؤال درستی که باید پرسید این نیست «چقدر تا الان روی این گذاشته‌ایم؟» بلکه این
      است: «اگر همین الان، بدون سابقه‌ی این دو سال، همین اطلاعات جلوی من بود، چه
      تصمیمی می‌گرفتم؟» و سؤالِ سخت‌ترِ بعدی: «اگر هیچ‌کس قرار نبود این تصمیم را
      قضاوت کند، همچنان همین انتخاب را می‌کردم؟» این دو سؤال، هم هزینه‌ی گذشته و
      هم ترسِ از قضاوتِ دیگران را از معادله حذف می‌کنند و تصمیم را به خودِ آینده
      برمی‌گردانند.
    exercise:
      prompt: "به یک پروژه، رابطه، یا مسیر شغلی فکر کن که فقط به‌خاطر زمان یا پولی که قبلاً رویش گذاشته‌ای — یا فقط به‌خاطر ترس از قضاوتِ دیگران — همچنان ادامه‌اش می‌دهی. اگر امشب هیچ‌کس قرار نبود بفهمد، همچنان همین تصمیم را می‌گرفتی؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۲.۱ — ساختار استدلال (نقش ناظر)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 2
  tag: "ماژول ۲ — ساختار استدلال"
  title: "کالبدشکافی یک رویا"
  body: >
    دوست صمیمی‌ات پشت میز کافه نشسته، دست‌هایش را به هم می‌کوبد از هیجان. چشم‌هایش
    برق می‌زند، صدایش تندتر از همیشه است: «من تصمیمم رو گرفتم. فردا استعفا می‌دم و
    یه کافه باز می‌کنم. مردم این روزا همه‌ش تو کافه‌ان، هر کافه‌ای می‌ری جا نیست
    بشینی. من که از دست مدیرم خسته شدم، هر روز داره روحمو می‌خوره. پس کافه زدن
    الان تنها راه نجات منه.» بعد مکث می‌کند، منتظر واکنش تو. تو می‌دانی او چند ماه
    پیش هم یک تصمیم ناگهانی مشابه گرفته بود که خیلی زود کنارش گذاشت. دلت می‌خواهد
    چیزی بگویی، اما نمی‌دانی از کجا شروع کنی — از دلسوزی برایش، از نگرانی برای
    پس‌اندازش، یا از یک سؤال ساده‌تر که هنوز نپرسیده‌ای.
  prompt: "نیازی نیست به او مشاوره بدهی. فقط بگو: ادعای نهایی (نتیجه‌گیری) او چیست و برای اثبات آن از چه دلایلی استفاده کرده است؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد یاد می‌گیرد ادعا (Claim) را از دلیل (Reason) جدا کند.
    - اگر کاربر مستقیم نصیحت داد یا با نتیجه‌گیری دوستش مخالفت کرد:
      «تو مستقیماً به سراغ مخالفت با او رفتی. اما اول باید ساختار حرفش را روی کاغذ بیاوری.»
    - اگر کاربر ساختار را درست تشخیص داد:
      «دقیقاً. تو الان ‹محتوا› را از ‹ساختار› جدا کردی. حالا نگاه کن — کدام دلیل احساسیه و کدام داده‌ی بازاری؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تفکیک ادعا از دلیل (Claim vs. Reason)"
    takeaway: >
      هر استدلال از دو بخش تشکیل شده: نتیجه‌گیری (چیزی که گوینده می‌خواهد تو باورش کنی)
      و دلایل (چیزهایی که برای اثبات آن نتیجه‌گیری آورده). قبل از اینکه بتوانی یک
      استدلال را نقد کنی، باید بتوانی این دو بخش را از هم جدا کنی — مهارتی که به‌طرز
      عجیبی نادر است، چون اغلب آدم‌ها مستقیم به سراغ موافقت یا مخالفت با نتیجه می‌روند،
      بدون اینکه اصلاً دلایل را جدا بررسی کرده باشند.


      در مثال کافه، نتیجه‌گیری روشن است: «باید کافه بزنم.» اما دلایل، چند نوع کاملاً
      متفاوت هستند و وزن یکسانی ندارند — «کافه‌ها پر هستند» یک مشاهده‌ی بازاری است
      که می‌تواند درست یا غلط باشد؛ «از دست مدیرم خسته شدم» یک انگیزه‌ی احساسی است
      که ربطی به موفقیت یک کسب‌وکار ندارد. جدا کردن این دو نوع دلیل، اولین قدم برای
      فهمیدن این است که استدلال واقعاً چقدر محکم است.


      این مهارت به‌خصوص وقتی سخت می‌شود که نتیجه‌گیریِ طرف مقابل، احساسات ما را
      (نگرانی، همدلی، یا حتی مخالفت) فعال می‌کند. عادت به «اول ساختار، بعد قضاوت»
      باعث می‌شود واکنش‌مان از سرِ فهمِ واقعیِ حرف طرف مقابل باشد، نه از سرِ واکنش
      آنیِ احساسی.
    exercise:
      prompt: "آخرین باری که کسی تصمیم بزرگی را با هیجان به تو گفت به یاد بیاور. اگر همان لحظه، بدون گفتن نظرت، فقط نتیجه‌گیری و دلایلش را روی کاغذ می‌نوشتی، چه چیزی می‌نوشتی؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۲.۲ — تعمیم شتابزده (نقش بازیگر)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 3
  tag: "ماژول ۲ — استدلال"
  title: "سه نمونه، یک قانون"
  body: >
    چهار سال درس مهندسی خوانده‌ای، اما دلت با علوم کامپیوتر است. بعد از کلی فکر
    کردن، تصمیم گرفته‌ای برای ارشد این مسیر جدید را بروی. با هیجان و کمی نگرانی،
    موضوع را با یکی از آشنایان باتجربه‌تر خانواده در میان می‌گذاری — کسی که سال‌هاست
    در همین حوزه کار می‌کند و نظرش برایت وزن دارد. او با یک قاطعیت غیرمنتظره سرش
    را تکان می‌دهد: «این اشتباهه. برنامه‌نویسی رو باید از بچگی شروع کرد، هر کی دیر
    شروع کنه دیگه نمی‌رسه به بقیه. خودم سه نفر رو دیدم که دیر رفتن سمت این رشته و
    هیچ‌کدوم موفق نشدن.» لحنش آن‌قدر مطمئن است که برای چند ثانیه واقعاً شک می‌کنی
    به تصمیمی که ماه‌ها رویش فکر کرده بودی. دلت می‌خواهد از او دفاع کنی از تصمیمت،
    اما نمی‌دانی از کجا شروع کنی.
  prompt: "فارغ از اینکه حرفش تو رو می‌ترساند یا نه، مثل یک جراح ساختار حرفش را بشکاف: ادعای نهایی او چیست و چه دلایلی برایش آورده؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد با Hasty Generalization روبه‌رو می‌شود.
    - اگر کاربر فقط دفاعی شد: «تو داری با نتیجه‌گیری او می‌جنگی، نه با پایه‌های آن.
      یک بار دیگر: چه دلایلی آورد؟»
    - اگر کاربر ساختار را درست دید: «تو دو نوع دلیل کاملاً متفاوت را از هم جدا کردی:
      یک ادعای کلی بدون منبع، و چند نمونه‌ی شخصی. اگر ۲۰ نفر پیدا کنی که دیر شروع کردند
      و موفق شدند، آیا ادعای او همچنان معتبر می‌ماند؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تعمیم شتابزده (Hasty Generalization)"
    takeaway: >
      تعمیم شتابزده زمانی رخ می‌دهد که از تعداد بسیار کمی نمونه، یک قانون کلی و
      قطعی استخراج می‌کنیم. «سه نفر را دیدم که دیر شروع کردند و موفق نشدند» یک
      مشاهده‌ی واقعی است، اما فاصله‌ی زیادی با «هر کسی دیر شروع کند، موفق نمی‌شود»
      دارد. سه نمونه، حتی اگر واقعی باشند، نمی‌توانند نماینده‌ی هزاران نفری باشند
      که همین مسیر را رفته‌اند.


      این مغالطه معمولاً قدرتمندتر به نظر می‌رسد وقتی از زبان کسی با تجربه یا اقتدار
      بیان شود، چون اطمینانِ لحنِ گوینده را با دقتِ آماریِ ادعا اشتباه می‌گیریم. اما
      اطمینان و صحت دو چیز کاملاً جدا هستند — کسی می‌تواند با کمال اطمینان، یک تعمیم
      نادرست را بیان کند، دقیقاً چون تجربه‌ی شخصی‌اش (سه نمونه) برایش کافی به نظر رسیده.


      راه محک‌زدن یک تعمیم، پرسیدن این است: «چند نمونه‌ی متضاد پیدا می‌شود که این
      قانون کلی را رد کند؟» اگر به‌راحتی بتوان چند نمونه‌ی موفق پیدا کرد که برخلاف
      ادعا عمل کرده‌اند، آن ادعا دیگر یک «قانون» نیست، فقط یک تجربه‌ی محدود شخصی است
      که به اشتباه به‌عنوان قاعده‌ی کلی بیان شده.
    exercise:
      prompt: "یک باور قوی درباره‌ی خودت یا آینده‌ات را به یاد بیاور که بر اساس نظر یا تجربه‌ی یک یا دو نفر شکل گرفته. اگر پنج نفر دیگر با تجربه‌ی متفاوت پیدا می‌کردی، آن باور چقدر محکم می‌ماند؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۳.۱ — حمله شخصی + توسل به اکثریت
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 4
  tag: "ماژول ۳ — مغالطه‌ها"
  title: "دادگاه تایم‌لاین"
  body: >
    نصف شب، درحالی‌که نمی‌توانی بخوابی، داری زیر یک پست بحث‌برانگیز اسکرول می‌کنی. کاربر الف نوشته: «کار حضوری از ۸ تا ۵ روی سلامت روان و خلاقیت تأثیر منفی داره. شرکت‌ها باید کار هیبریدی رو استاندارد کنن.» زیرش، کاربر ب — با تیک آبی و هزاران فالوور — با لحنی تند جواب داده: «تو ۲۲ سالته، هنوز خونه‌ی پدرتی، یه روز سابقه‌ی مدیریت نداری، اون‌وقت نسخه می‌پیچی؟ میلیون‌ها آدم دارن با افتخار ۹ تا ۵ کار می‌کنن. این لوس‌بازی‌ا رو تموم کنید.» کامنت پنج هزار لایک خورده در یک ساعت، صدها ریپلای موافق زیرش. حسی از تردید در تو شکل می‌گیرد — شاید واقعاً کاربر ب راست می‌گوید، شاید کاربر الف واقعاً بی‌تجربه است. اما یک چیزی توی معده‌ات می‌گوید که این استدلال، هرچقدر هم لایک بخورد، یک جای کارش می‌لنگد.
  prompt: "فارغ از اینکه حق با کدامشان است، بگو چرا استدلال «کاربر ب» از هم پاشیده است."
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Ad Hominem و Appeal to Majority را شناسایی می‌کند.
    - اگر کاربر درگیر محتوا/سن شد: «تو هم در همان تله‌ای افتادی که آن پنج هزار نفر افتادند —
      داری سِن گوینده را بررسی می‌کنی، نه ادعای اصلی را.»
    - اگر کاربر باگ‌ها را پیدا کرد: «دقیق است. حالا این سؤال: اگر ادعای اول را یک مدیر ۶۰ ساله مطرح
      می‌کرد، تأثیر کار حضوری روی خلاقیت تغییر می‌کرد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "حمله شخصی و توسل به اکثریت (Ad Hominem & Appeal to Majority)"
    takeaway: >
      حمله‌ی شخصی زمانی رخ می‌دهد که به‌جای نقد ادعا، به ویژگی‌های شخصی گوینده —
      سن، تجربه، جایگاه اجتماعی — حمله می‌کنیم. «تو ۲۲ سالته و تجربه نداری» ممکن
      است واقعیت داشته باشد، اما هیچ ربطی به درست یا غلط بودنِ جمله‌ی «کار حضوری روی
      سلامت روان اثر منفی دارد» ندارد. سن گوینده، ادعا را نه اثبات می‌کند نه رد.


      توسل به اکثریت هم مغالطه‌ی دومی است که در همین کامنت پنهان است: «میلیون‌ها آدم
      دارن با افتخار ۹ تا ۵ کار می‌کنن» به این معنا نیست که این سبک کار برای سلامت
      روان مضر نیست — فقط نشان می‌دهد که این سبک رایج است. رواج یک چیز، هیچ تضمینی
      درباره‌ی درستی یا سلامت‌بخش بودنش نمی‌دهد؛ در طول تاریخ چیزهای زیادی رایج بوده‌اند
      که بعداً اشتباه از آب درآمدند.


      نکته‌ی خطرناک این است که وقتی یک کامنت هزاران لایک می‌خورد، مغز ما ناخودآگاه
      محبوبیت را با درستی اشتباه می‌گیرد — این خودش نوعی توسل به اکثریت است که روی
      خودِ ما هم اثر می‌گذارد، حتی وقتی داریم مغالطه را در دیگران تحلیل می‌کنیم.
    exercise:
      prompt: "یک بحث آنلاین به یاد بیاور که در آن یک کامنت با لایک بالا نظرت را عوض کرد. اگر همان کامنت هیچ لایکی نداشت و فقط متنش را می‌خواندی، همچنان همین‌قدر قانع‌کننده بود؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۳.۲ — دوراهی کاذب + شیب لغزنده
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 5
  tag: "ماژول ۳ — مغالطه‌ها"
  title: "بن‌بست عاطفی"
  body: >
    یک پیشنهاد کاری از یک استارتاپ شناخته‌شده گرفته‌ای — نقش کلیدی، مسئولیت بالا،
    و به‌احتمال زیاد ساعات کاری بیشتر. با هیجان با شریک عاطفی‌ات در میان می‌گذاری،
    اما جای شادی، چهره‌اش جمع می‌شود. با صدایی که سعی می‌کند آرام بماند، می‌گوید:
    «تو یا باید این شغل رو رد کنی تا زندگیمون حفظ بشه، یا قبولش کنی و قید این رابطه
    رو بزنی. اگه بری، اولش می‌گن فقط روزای کاری، بعدش آخر هفته‌ها هم کار می‌کنی،
    کم‌کم عصبی می‌شی، دیگه وقتی برای هم نداریم و آخرش دو تا هم‌خونه‌ی غریبه می‌شیم.»
    چشم‌هایش پر از نگرانی واقعی است، نه بهانه. دلت می‌خواهد فوراً بگویی «نه، هیچ‌وقت
    این‌طور نمی‌شود» یا برعکس، شروع کنی به دفاع از حقت برای پیشرفت. اما زیر آن
    موج احساسی، چیزی در حرفش هست که می‌خواهی دقیق‌تر ببینی.
  prompt: "نگرانی او واقعی و قابل درک است. اما اگر بخواهی اضطراب کلماتش را کنار بزنی، او چگونه گزینه‌های تو را محدود کرد و چگونه آینده را پیش‌بینی کرد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد False Dichotomy و Slippery Slope را از دلِ یک ترس واقعی
    بیرون می‌کشد — با احترام به احساسات طرف مقابل.
    - اگر کاربر فقط دفاع احساسی کرد: «تو داری به احساساتش پاسخ می‌دهی، که طبیعی است.
      اما هنوز اسکلت حرفش را ندیده‌ای. به گزینه‌هایی که به تو داد نگاه کن —
      واقعاً دنیا همین‌قدر صفر و یک است؟»
    - اگر کاربر ساختار را دید: «دقیقاً. آیا از نظر منطقی غیرممکن است که کسی هم رابطه‌اش را دوست
      داشته باشد و هم مقطعی درگیر کارش باشد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "دوراهی کاذب و شیب لغزنده (False Dichotomy & Slippery Slope)"
    takeaway: >
      دوراهی کاذب زمانی رخ می‌دهد که یک طیف واقعی از گزینه‌ها را به دو حالت افراطی
      محدود کنیم: «یا این شغل یا این رابطه.» در واقعیت، بین این دو، گزینه‌های زیادی
      وجود دارد — تعیین مرزهای کاری، صحبت درباره‌ی انتظارات، بازبینی دوره‌ای شرایط.
      وقتی کسی دنیا را فقط با دو گزینه‌ی افراطی نشانت می‌دهد، دارد مسیرهای میانی را
      از دیدت پنهان می‌کند، شاید بدون آنکه خودش هم متوجه باشد.


      شیب لغزنده مغالطه‌ی دوم این متن است: فرض اینکه یک قدم کوچک (قبول یک شغل جدید)
      به‌طور اجتناب‌ناپذیر به فاجعه‌ای بزرگ (تبدیل شدن به «دو تا هم‌خونه‌ی غریبه») ختم
      می‌شود، بدون آنکه هیچ نقطه‌ی توقف یا تصمیم آگاهانه‌ای در این مسیر در نظر گرفته
      شود. زنجیره‌ی علّی‌ای که او ترسیم کرده، ممکن است رخ دهد، اما «ممکن است» با
      «حتماً رخ می‌دهد» فرق زیادی دارد.


      نکته‌ی مهم این است که دیدن این دو مغالطه، به معنای انکار ترسِ پشتِ آن‌ها نیست.
      می‌توانی همزمان بگویی «نگرانی‌ات را می‌فهمم و جدی می‌گیرم» و «اما فکر نمی‌کنم
      گزینه‌های ما فقط همین دو تای افراطی باشند.» تفکر منطقی، احساسات را کنار نمی‌گذارد؛
      فقط اجازه نمی‌دهد احساسات، ساختار واقعیِ گزینه‌ها را از دیدت پنهان کنند.
    exercise:
      prompt: "یک موقعیت اخیر را به یاد بیاور که کسی (یا خودت) آن را «یا این یا آن» توصیف کرده بود. اگر می‌نشستی و گزینه‌های میانی را لیست می‌کردی، چند تا پیدا می‌کردی؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۴ — ارزیابی شواهد (Anecdotal Evidence)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 6
  tag: "ماژول ۴ — ارزیابی شواهد"
  title: "معجزه‌ی دم‌نوش"
  body: >
    چند روزی است سردردهای میگرنی امانت را بریده‌اند. سرِ کار، حتی نور مانیتور هم
    آزارت می‌دهد. همکارت که می‌بیند چهره‌ات جمع شده، صندلی‌اش را نزدیک می‌کند و با
    لحنی صمیمی می‌گوید: «منم سال‌ها این سردردها رو داشتم، هیچ دکتری نتونست کاری کنه.
    تا اینکه شروع کردم هر روز صبح ناشتا زنجبیل، دارچین و آب‌لیمو خوردن. شش ماهه
    حتی یک بار سردرد نگرفتم! حتماً امتحانش کن، قطعی درمانت می‌کنه.» چشم‌هایش پر از
    خوشحالی واقعی برای کمک کردن به توست، نه فروش چیزی. برای لحظه‌ای وسوسه می‌شوی
    همین امروز از داروخانه زنجبیل و دارچین بخری — دلت می‌خواهد باور کنی راه‌حلی به
    این سادگی وجود دارد، بعد از هفته‌ها دویدن پیش دکترهای مختلف بدون نتیجه.
  prompt: "نیت او خیرخواهانه است. ادعای او چیست، و چرا با وجود اینکه او واقعاً شش ماه سردرد نگرفته، حرفش نمی‌تواند برای «قطعی بودن این درمان» کافی باشد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد یاد می‌گیرد Anecdotal Evidence را از شواهد معتبر جدا کند.
    - اگر کاربر به خود درمان حمله کرد: «شاید حق با تو باشد، اما بحث ما این نیست.
      حتی اگر درباره‌ی داروی دیگری صحبت می‌کرد، چرا تجربه‌ی موفق یک نفر برای اثبات قطعیت کافی نیست؟»
    - اگر کاربر کفایت نمونه را زیر سؤال برد: «دقیق است. تو نیت خیر او را از وزن استدلالش جدا کردی.
      اگر ۵۰ نفر دیگر همین ترکیب را بخورند و خوب نشوند، هنوز می‌توان گفت این ترکیب
      ‹باعث› خوب شدن همکارت شده؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "شواهد حکایتی (Anecdotal Evidence)"
    takeaway: >
      شواهد حکایتی، تجربه‌ی یک یا چند نفر است که به‌عنوان دلیل برای یک ادعای کلی
      بیان می‌شود. تجربه‌ی همکارت — که واقعاً شش ماه سردرد نگرفته — یک واقعیت است،
      اما نمی‌تواند اثبات کند که «این ترکیب» علتِ بهبودش بوده، چون هزاران عامل دیگر
      (تغییر رژیم خواب، کاهش استرس، حتی خودبه‌خود بهتر شدن بدن) هم می‌توانستند نقش
      داشته باشند. بدون مقایسه با یک گروه کنترل، نمی‌توان علیت را از هم‌زمانی
      (Correlation) جدا کرد.


      نکته‌ی ظریف این است که نیت خیرخواهانه‌ی گوینده، هیچ ربطی به وزن علمی شواهدش
      ندارد. همکارت با کمال صداقت و دلسوزی حرف می‌زند، و دقیقاً همین صداقت است که
      قانع‌کننده به نظر می‌رسد — اما صداقتِ گوینده و صحتِ رابطه‌ی علّی، دو محور کاملاً
      جدا هستند.


      سؤال درست برای سنجیدن یک ادعای درمانی این نیست «آیا این برای یک نفر جواب داد؟»
      بلکه این است: «آیا این نتیجه در یک مطالعه‌ی کنترل‌شده، روی گروه بزرگ‌تری از
      آدم‌ها، تکرار شده؟» بدون این تکرار، بهترین کاری که می‌توان با یک تجربه‌ی شخصی
      کرد، نگه‌داشتنش به‌عنوان یک احتمالِ کنجکاوی‌برانگیز است، نه یک نتیجه‌ی قطعی.
    exercise:
      prompt: "یک توصیه‌ی سلامتی یا درمانی که فقط بر اساس تجربه‌ی یک نفر پذیرفته‌ای را به یاد بیاور. اگر می‌خواستی همین امروز آن را واقعاً بررسی کنی، دنبال چه نوع شواهدی می‌گشتی؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۵ — فرض‌های پنهان (Implicit Assumption)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 7
  tag: "ماژول ۵ — فرض‌های پنهان"
  title: "قانون نانوشته"
  body: >
    وارد خانه می‌شوی و فضا سنگین است. شریک عاطفی‌ات روی مبل نشسته، نگاهش به گوشی‌اش
    است اما مشخص است که چیزی درست نیست. می‌پرسی «چیزی شده؟» او بدون اینکه نگاهت
    کند، با صدایی سرد جواب می‌دهد: «اگه واقعاً برام ارزش قائل بودی، خودت می‌فهمیدی
    چرا ناراحتم و نیازی نبود من توضیح بدم.» یک موج ناراحتی در تو بالا می‌آید — از
    یک طرف حس گناه، انگار واقعاً باید می‌فهمیدی؛ از طرف دیگر یک سردرگمی خالص، چون
    واقعاً هیچ نشانه‌ای نداری از اینکه امروز چه اتفاقی افتاده. برای چند ثانیه فقط
    آنجا می‌ایستی، بین حس گناه و حس اینکه چیزی در این جمله درست نیست، اما نمی‌دانی چه.
  prompt: "او بین «دوست داشتن» و «توضیح ندادن» یک پل نامرئی کشیده. چه قانون نانوشته‌ای در ذهن او این جمله را برایش بدیهی کرده؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Implicit Assumption (قیاس مضمر) را کشف می‌کند.
    - اگر کاربر فقط دفاعی شد: «تو گفتی تله‌پاتی بلد نیستی؛ پس او چه قانونی برای ‹عشق›
      در ذهن دارد که تو را این‌گونه قضاوت می‌کند؟»
    - اگر کاربر فرض را کشف کرد: «دقیق است. او در ذهنش دارد: ‹اهمیت دادن = توانایی ذهن‌خوانی›.
      آیا میزان عشق، توانایی‌های شناختی انسان را تغییر می‌دهد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "فرض پنهان / قیاس مضمر (Implicit Assumption)"
    takeaway: >
      هر استدلال، حتی کوتاه‌ترین جمله‌ها، روی یک یا چند فرضِ نانوشته سوار است —
      باوری که گوینده آن را آن‌قدر بدیهی می‌داند که حتی به زبان نمی‌آوردش، اما بدون
      آن، کل استدلال از هم می‌پاشد. جمله‌ی «اگه دوستم داشتی، می‌فهمیدی چرا ناراحتم»
      فقط با این فرضِ پنهان کار می‌کند که «اهمیت دادن به کسی، به معنای توانایی
      ذهن‌خوانی است» — فرضی که وقتی صریح بیان شود، آشکارا غیرمنطقی به نظر می‌رسد.


      فرض‌های پنهان خطرناک‌ترند وقتی در قالب احساسی بیان می‌شوند، چون ذهن ما بیشتر
      درگیر پاسخ به احساس (حس گناه، ترس از قضاوت) می‌شود تا بررسی منطق پشتِ جمله.
      مهارتِ پیدا کردن فرض پنهان این است: بپرسی «اگر این جمله درست باشد، چه باور
      دیگری باید از قبل درست بوده باشد؟» — و آن باور را جداگانه، با فاصله از فضای
      احساسی، بررسی کنی.


      دیدن فرض پنهان به معنای رد کردن احساسات طرف مقابل نیست. می‌توانی همزمان بگویی
      «می‌بینم ناراحتی و برایم مهم است» و «اما فکر نمی‌کنم دوست‌داشتن، به معنای
      ذهن‌خوانی باشد — به من بگو چه شده.» جدا کردن این دو، رابطه را واقعی‌تر می‌کند،
      نه سردتر.
    exercise:
      prompt: "یک جمله‌ی اخیر را به یاد بیاور که در آن کسی (یا خودت) از تو انتظاری داشت بدون اینکه آن را بیان کند. اگر آن انتظار را به‌صراحت به زبان می‌آوردید، همچنان همان‌قدر منطقی به نظر می‌رسید؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۶ — تفکر احتمالاتی
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 8
  tag: "ماژول ۶ — تفکر احتمالاتی"
  title: "دماسنج اطمینان"
  body: >
    صبح، توی تایم‌لاینت یک پست می‌بینی که هزار بار ریتوییت شده: «تحقیق جدید: مصرف
    روزانه قهوه خطر بیماری قلبی رو ۴۰٪ کاهش می‌ده!» تو که هر روز سه فنجان قهوه
    می‌خوری، با رضایت لبخند می‌زنی — انگار عادتت حالا رسماً «سالم» شده. کنجکاو
    می‌شوی و کمی بیشتر می‌کاوی. لایه‌ی اول: می‌فهمی این در واقع پست وبلاگی یک
    اینفلوئنسر سلامت است که به یک مقاله لینک داده، نه خودِ مقاله‌ی علمی. لایه‌ی
    دوم: مقاله‌ی اصلی را پیدا می‌کنی — یک مطالعه‌ی مشاهده‌ای روی فقط ۲۰۰ نفر بوده،
    نه یک آزمایش کنترل‌شده‌ی بزرگ. لایه‌ی سوم: در انتهای همان مقاله، خودِ نویسندگان
    نوشته‌اند «نیاز به مطالعات بیشتر برای تأیید این رابطه هست.» لبخند اول کمی
    محو می‌شود، اما نمی‌دانی دقیقاً چقدر باید نگرانش باشی.
  prompt: "بعد از دیدن این سه لایه، اطمینانت به این ادعا چقدر تغییر کرد و چرا؟ (هیچ‌کدام از این اطلاعات ادعا را «دروغ» اعلام نکرد)"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد یاد می‌گیرد باور را در حالت خاکستری نگه دارد، نه صفر/صد.
    پرسش سقراطی اصلی: «به مسیر عددی که طی کردی نگاه کن. هیچ‌کدام از این اطلاعات،
    ادعا را ‹دروغ› اعلام نکرد. پس چرا اطمینانت این‌قدر تغییر کرد؟»
    هدف: نشان دادن که باور نباید سوئیچ روشن/خاموش باشد؛ باید دیالی باشد که مدام می‌چرخد.
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تفکر احتمالاتی و درجه‌بندی باور (Probabilistic Thinking / Calibration)"
    takeaway: >
      اغلب ما به ادعاها مثل یک سوئیچ برخورد می‌کنیم — یا کاملاً باورش می‌کنیم یا
      کاملاً ردش می‌کنیم. اما تفکر منطقیِ بالغ، باور را مثل یک دیال می‌بیند که از
      صفر تا صد درجه دارد و با هر اطلاعات جدید، کمی می‌چرخد، نه اینکه یک‌باره از
      یک سر به سر دیگر بپرد. هیچ‌کدام از سه لایه‌ای که در این داستان کشف کردی —
      منبع ثانویه بودن، حجم کم نمونه، و هشدار خودِ نویسندگان — ادعا را «دروغ» اعلام
      نکردند، اما هرکدام باید مقداری از اطمینان اولیه‌ات را کم می‌کردند.


      این نوع تفکر را «کالیبراسیون» می‌نامند: هماهنگ‌کردن سطح اطمینانت با کیفیت
      واقعی شواهد. یک مطالعه‌ی مشاهده‌ای روی ۲۰۰ نفر، شواهد ضعیف‌تری از یک آزمایش
      کنترل‌شده روی ده‌هزار نفر است — نه چون لزوماً نتیجه‌اش غلط است، بلکه چون
      احتمال خطا در آن بیشتر است. باورِ خوب‌کالیبره‌شده یعنی به یک نتیجه‌ی ضعیف،
      اطمینانِ متوسط بدهی، نه اطمینانِ صد در صد و نه رد کاملش.


      مزیت این نوع تفکر این است که نیازی نیست هر ادعا را کاملاً رد یا کاملاً بپذیری.
      می‌توانی بگویی «ممکن است درست باشد، اما شواهدش هنوز ضعیف است، پس فعلاً با
      احتیاط باورش می‌کنم» — جمله‌ای که هم به شواهد احترام می‌گذارد و هم به عدم
      قطعیتِ واقعیِ دنیا.
    exercise:
      prompt: "یک خبر یا ادعای علمی که اخیراً دیدی را به یاد بیاور و سه لایه‌ی همین داستان (منبع اصلی چیست، حجم نمونه چقدر بود، خودِ محققان چه گفته‌اند) را رویش پیاده کن. اطمینانت بعد از این بررسی چند درصد تغییر کرد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۷ — مخالفت با خود (Steelman / Confirmation Bias)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 9
  tag: "ماژول ۷ — مخالفت با خود"
  title: "وکیل مدافع طرف مقابل"
  body: >
    این بار قرار نیست وارد داستان کس دیگری بشوی. فانوس یک جمله جلوی تو می‌گذارد و
    از تو می‌خواهد خودت را محک بزنی: «هوش مصنوعی در ۱۰ سال آینده، بیشتر از اینکه
    شغل جدید بسازد، شغل از بین می‌برد.» چند ثانیه به این جمله خیره می‌مانی. یک
    موضعی در ذهنت شکل می‌گیرد — موافق یا مخالف، فرقی نمی‌کند کدام — و بلافاصله
    استدلال‌هایی برای اثباتش می‌آیند، انگار مغزت از قبل آماده‌شان کرده بود. حالا
    کار سخت‌تر شروع می‌شود: باید قوی‌ترین و منطقی‌ترین استدلال را علیه همین موضعِ
    خودت بنویسی. نه یک نسخه‌ی ضعیف که راحت بشود ردش کرد، بلکه استدلالی که یک
    متخصص باهوش و مخالفِ تو، دقیقاً همین را می‌گفت. قلم را برمی‌داری، اما دستت
    کمی مقاومت می‌کند — انگار نوشتن علیه خودت، از هر بحثی با یک نفر دیگر سخت‌تر است.
  prompt: "موضعت را بنویس، سپس قوی‌ترین استدلال مخالف خودت را بنویس."
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Steelman تمرین می‌کند تا Confirmation Bias را کاهش دهد.
    - اگر کاربر یک نسخه‌ی ضعیف/کاریکاتوری از طرف مقابل نوشت:
      «نگاه کن چه نوشتی. آیا این واقعاً قوی‌ترین حرفی است که یک متخصص مخالف تو می‌زد،
      یا یک نسخه‌ی ساده‌شده که راحت شکستش بدهی؟ همان مغالطه‌ی ‹مرد پوشالی› را الان
      روی باور خودت پیاده می‌کنی — تا از فکر کردن واقعی فرار کنی.»
    - اگر کاربر واقعاً یک استدلال قوی نوشت:
      «این استدلال واقعاً قوی بود. وقتی داشتی این را می‌نوشتی، چه حسی داشتی؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "مرد آهنین / استیل‌من (Steelmanning) و سوگیری تأییدی (Confirmation Bias)"
    takeaway: >
      سوگیری تأییدی گرایش طبیعی مغز ماست به جست‌وجو، تفسیر، و به‌یادآوردنِ اطلاعاتی
      که باورهای از‌قبل‌داشته‌مان را تأیید می‌کنند، و نادیده‌گرفتن یا کم‌اهمیت‌جلوه‌دادنِ
      اطلاعاتی که آن‌ها را زیر سؤال می‌برند. این سوگیری آن‌قدر قوی است که حتی وقتی
      فکر می‌کنیم داریم «بی‌طرفانه» فکر می‌کنیم، معمولاً فقط داریم دلایل بیشتری برای
      چیزی جمع می‌کنیم که از قبل باورش داشتیم.


      استیل‌من‌کردن (در مقابل «مرد پوشالی» یا Straw Man) یعنی به‌جای ساختن یک نسخه‌ی
      ضعیف و راحت‌شکستنی از دیدگاه مخالف، قوی‌ترین و منطقی‌ترین نسخه‌ی ممکن از آن
      را بسازی — نسخه‌ای که حتی خودِ مدافعانِ آن دیدگاه، آن را عادلانه بدانند. این
      تمرین سخت است، دقیقاً چون طبیعت مغز ما در جهت مخالفش حرکت می‌کند.


      فایده‌ی استیل‌من‌کردن فقط «منصف بودن» نیست. وقتی می‌توانی قوی‌ترین نسخه‌ی
      مخالفِ باور خودت را بسازی، دو اتفاق می‌افتد: یا باورت را با شواهد و منطق
      بیشتری محکم می‌کنی، یا متوجه می‌شوی جاهایی از باورت لرزان بوده. هر دو نتیجه،
      تو را به یک متفکر دقیق‌تر تبدیل می‌کند — نه یک متفکر ضعیف‌تر.
    exercise:
      prompt: "یک باور سیاسی، اجتماعی، یا شخصی که به آن مطمئنی را انتخاب کن. پنج دقیقه وقت بگذار و قوی‌ترین استدلال ممکن علیه آن باور را بنویس — طوری که یک متخصص مخالفِ باورت، از نوشته‌ات راضی باشد."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ماژول ۸ — تصمیم‌گیری منطقی (جمع‌بند کل کورس)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 10
  tag: "ماژول ۸ — تصمیم‌گیری منطقی"
  title: "چهار ستون یک تصمیم"
  body: >
    ایمیلی رسیده که یک شرکت در شهر دیگر پیشنهاد شغلی با حقوق به‌مراتب بالاتر داده.
    قبولش یعنی جابه‌جایی کامل: دور شدن از خانواده، از دوستانی که سال‌ها کنارشان
    بوده‌ای، از زندگی آشنایی که الان داری. رد کردنش یعنی ماندن در امنیت فعلی، اما
    با حقوق پایین‌تر و فرصت رشد کمتر. یک هفته وقت داری جواب بدهی — یک هفته که هر
    شب، قبل از خواب، ذهنت بین دو گزینه در نوسان است، بی‌آنکه به جایی برسد. فانوس
    این بار به‌جای یک سؤال، چهار سؤال کوتاه پشت سر هم می‌پرسد: گزینه‌هایت دقیقاً
    چیست؟ برای هرکدام، مهم‌ترین پیامدی که معمولاً وقتی هیجان‌زده یا ترسیده‌ای نادیده
    می‌گیری چیست؟ اگر گزینه‌ای که انتخاب نمی‌کنی را کنار بگذاری، دقیقاً چه چیزی از
    دست می‌دهی؟ و کدام ارزش برایت این لحظه مهم‌تر است: امنیت، رشد، یا نزدیکی به آدم‌ها؟
  prompt: "به چهار سؤال بالا پاسخ بده. بعد از نوشتن، اگر می‌خواستی فقط با شهود تصمیم بگیری، کدام گزینه را انتخاب می‌کردی؟ آیا با آنچه الان نوشتی همخوانی دارد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی و این مأموریت جمع‌بند کل کورس است — کاربر باید همه‌ی ابزارها را
    با هم به‌کار ببرد: هزینه‌ی هدررفته، ساختار استدلال، مغالطه، شواهد، فرض‌های پنهان،
    احتمال، مخالفت با خود.
    - اگر کاربر فقط جنبه‌ی مالی/منطقی خشک را دید (بدون ارزش‌ها):
      «تو تا الان فقط عدد و منطق را دیدی. اما یک تصمیم منطقی واقعی، ارزش‌ها را هم داخل
      محاسبه می‌آورد. اگر ارزش اصلی‌ات ‹نزدیکی به خانواده› باشد، آیا حقوق بالاتر همچنان
      همان وزن را دارد؟»
    - اگر کاربر فقط احساسی تصمیم گرفت: «تصمیمت روشن است، اما هنوز پیامدهای واقعی گزینه‌ی مقابل
      را ننوشتی. آن‌ها را هم روی کاغذ بیاور — نه برای عوض کردن تصمیم، برای اطمینان از اینکه
      چشمانت باز است.»
    - اگر کاربر هر چهار ستون را متعادل پر کرد: «تو گزینه‌ها، پیامدها، هزینه‌ی فرصت، و ارزش‌هایت را
      کنار هم گذاشتی. این دقیقاً همان چیزی است که یک تصمیم منطقی را از یک واکنش لحظه‌ای جدا می‌کند.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تصمیم‌گیری ساختاریافته (Structured Decision-Making)"
    takeaway: >
      نُه مهارتی که در این کورس تمرین کردی — دیدن مغالطه‌ی هزینه‌ی هدررفته، تفکیک
      ادعا از دلیل، شناسایی تعمیم شتابزده، دیدن حمله‌ی شخصی و توسل به اکثریت، تشخیص
      دوراهی کاذب و شیب لغزنده، سنجیدن شواهد حکایتی، کشف فرض‌های پنهان، تفکر
      احتمالاتی، و استیل‌من‌کردنِ دیدگاه مخالف — بیشترشان ابزارهایی برای «نقد»
      استدلال دیگران بودند. تصمیم‌گیری منطقی، همان ابزارها را، اما این بار روی
      تصمیم‌های خودمان به‌کار می‌برد.


      بزرگ‌ترین اشتباه در تصمیم‌های بزرگ زندگی این است که یا کاملاً «خشک و منطقی»
      عمل کنیم (فقط عدد و حقوق را ببینیم) یا کاملاً «شهودی و احساسی» (فقط با ترس
      یا هیجان لحظه تصمیم بگیریم). تصمیم منطقی واقعی، جایی بین این دو ایستاده:
      گزینه‌ها را واضح می‌بیند، پیامدهای پنهان را کشف می‌کند، هزینه‌ی فرصت را
      حساب می‌کند — و در نهایت، به ارزش‌های واقعیِ فرد هم وزن می‌دهد، چون هیچ
      فرمول ریاضی‌ای نمی‌تواند برایت تعیین کند «نزدیکی به خانواده» چقدر می‌ارزد.


      هدف نهایی این کورس این نبود که هرگز اشتباه نکنی. هدف این بود که وقتی تصمیم
      می‌گیری، بدانی دقیقاً چرا آن تصمیم را گرفتی — نه اینکه بعداً، در آرامش، متوجه
      شوی یک مغالطه یا فرضِ پنهان، بی‌آنکه بدانی، تصمیمت را شکل داده بود.
    exercise:
      prompt: "یک تصمیم واقعی و بزرگ که این ماه‌ها پیش رو داری را بردار و چهار سؤال همین داستان (گزینه‌های واقعی، پیامد نادیده‌گرفته‌شده، هزینه‌ی فرصت، ارزش اصلی) را رویش، روی کاغذ، پیاده کن."
