slug: critical-thinking-career
title: "تفکر نقاد — مسیر شغلی"
description: "چرا این حرف زده شد؟ چه کسی نفع می‌برد؟ کشف حباب اطلاعاتی خودت."

default_ai_system_prompt: |
  تو «فانوس» هستی، یه راهنمای سقراطی برای آموزش تفکر انتقادی به زبان فارسی.
  تفاوت این کورس با منطق: اینجا به خود جمله نگاه نمی‌کنیم — به گوینده، انگیزه، و منبع نگاه می‌کنیم.
  قوانین سفت‌وسخت:
  - هرگز نگو پاسخ کاربر درسته یا غلطه.
  - هرگز جواب آماده نده.
  - در ۲ تا ۴ جمله‌ی کوتاه، زاویه‌ای درباره‌ی انگیزه یا منبع ادعا نشان بده.
  - لحن گرم و بدون قضاوت. فقط فارسی.

# ─────────────────────────────────────────────────────────────
# یادداشت معماری (بعد از ممیزی): app/ai_feedback.py دیگر ai_socratic_prompt
# را به‌عنوان یک اسکریپت جواب آماده نمی‌خواند. یک SOCRATIC_ENGINE_SYSTEM_PROMPT
# مشترک، قوانین رفتاری پایه (روش الِنخوس + تشخیص CoT در تگ <analysis>) را برای
# هر ۲۷ سناریو یکسان اعمال می‌کند؛ محتوای ai_socratic_prompt هر گام فقط به‌عنوان
# «یادداشتِ زمینه‌ای» (مفهومِ هدف + لایه‌ی پنهانِ مخصوصِ همین سناریو) تزریق
# می‌شود، نه متنی برای کپیِ عینی. سناریوی order:1 در logical-thinking.yaml به
# همین سبک بازنویسی شده — الگو برای بازنویسیِ تدریجیِ بقیه‌ی سناریوهاست.
# ─────────────────────────────────────────────────────────────

steps:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۱ — فهم آسیب‌پذیری همگانی (انگیزه‌ی فرستنده)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 1
  tag: "فصل ۱ — آسیب‌پذیری همگانی"
  title: "پیام خانوادگی"
  body: >
    ساعت نُه شب است. گوشی‌ات ویبره می‌رود — گروه خانوادگی واتساپ. مادرت یک ویدیوی
    فوروارد شده گذاشته: زنی با لهجه‌ی آرام‌بخش توضیح می‌دهد که «این نوشیدنی گیاهی
    دیابت رو کاملاً درمان می‌کنه. شرکت‌های دارویی نمی‌ذارن این خبر پخش بشه چون سودشون
    از بین می‌ره.» زیرش مادرت نوشته: «بابات حتماً باید امتحان کنه، جدی می‌گم.»
    انگشتت روی صفحه می‌ماند. یک طرفِ ذهنت می‌گوید «این که واضحاً کلاهبرداریه»،
    اما طرف دیگر یادت می‌آورد که مادرت هیچ‌وقت چیز مسخره فوروارد نمی‌کند، و اگر
    همین الان بگویی «مامان این دروغه»، صدایش را می‌شنوی که می‌گوید «تو که همه‌چی رو
    رد می‌کنی، دکترا هم گاهی اشتباه می‌کنن.» دلت نمی‌خواهد بحث خانوادگی راه بیفتد،
    نه امشب. برای چند ثانیه، انگشتت روی گزینه‌ی «Reply» می‌ماند، بی‌آنکه بدانی
    دقیقاً چه بنویسی — رد کنی، تأیید کنی، یا فقط سکوت کنی و بگذری.
  prompt: "اولین واکنش درونی‌ات چیست؟ و اگر بخواهی صادق باشی: اگر این پیام را یک غریبه در اینستاگرام فرستاده بود، همین واکنش را داشتی؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. هدف این ایستگاه شناسایی توجیه اصلی کاربر و باز کردن یک سؤال مچ‌گیرانه است.
    اول ببین کاربر کدام توجیه را آورده:
    - اگر گفت چون مادرش است راحت‌تر رد نمی‌کند → این توجیه را نام ببر و آن را به سؤال اصلی کورس (منبع در برابر محتوا) وصل کن:
      «دقیقاً همین نکته مهم است. تو داری اعتراف می‌کنی که میزان اعتمادت به یک ادعا،
      با میزان نزدیکی گوینده عوض می‌شود — نه با درستی خود ادعا.»
    - اگر گفت فوراً رد می‌کند و انگیزه‌ای پشتش نمی‌بیند → توجیهش را با یک نمونه‌ی متضاد از زندگی خودش محک بزن:
      «خوبه. اما چند وقت پیش یک توصیه از یک دوست نزدیک شنیدی و بدون چک کردن قبولش کردی؟»
    سپس، صرف‌نظر از مسیر، یک سؤال مچ‌گیرانه درباره‌ی خود متن پیام بپرس تا عمق را نشان بده:
    «این پیام یک جمله‌ی هوشمندانه هم دارد: ‹شرکت‌های دارویی نمی‌گذارند این خبر پخش شود.›
    این جمله چه کاری برای نویسنده‌ی پیام انجام می‌دهد؟ چه اعتراضی را از قبل خنثی می‌کند؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "سوگیری منبع / اثر پیام‌رسان (Source Bias / Messenger Effect)"
    takeaway: >
      مغز ما یک میان‌بر قدیمی دارد: به‌جای اینکه هر بار محتوای یک ادعا را از صفر بسنجیم،
      از اعتماد قبلی‌مان به گوینده استفاده می‌کنیم. این میان‌بر در طول تاریخ منطقی بوده — وقتی
      اطلاعات کم بود و زمان تحلیل نداشتیم، اعتماد به «کسی که می‌شناسیم» ارزان‌تر از بررسی
      مستقل بود. مشکل اینجاست که در دنیای امروز، همان اعتماد خانوادگی و دوستانه، مسیر
      اصلی پخش اطلاعات نادرست شده است — چون فورواردکننده معمولاً نیت بد ندارد، فقط
      خودش هم قربانی همین سوگیری بوده.


      نکته‌ی ظریف‌تر این است که جمله‌ی «شرکت‌های دارویی نمی‌ذارن این خبر پخش بشه» یک
      تکنیک رایج در محتوای نادرست پزشکی است: پیش از آنکه شک تو را ببیند، برایش توضیحی
      آماده می‌کند. اگر تو شک کنی، پیام از قبل گفته «چون سودشون از بین می‌ره» — یعنی شکِ تو
      را هم بخشی از توطئه جا می‌زند. این ساختار را «واکسینه‌کردن در برابر شک» می‌نامند.


      نکته‌ی مهم این نیست که هرگز به عزیزانت اعتماد نکنی، بلکه این است که اعتماد به گوینده
      و درستیِ محتوا دو محور کاملاً جدا هستند. کسی می‌تواند با بهترین نیت دنیا، غلط‌ترین
      اطلاعات را برایت بفرستد.
    exercise:
      prompt: "به سه پیام آخری که در گروه‌های خانوادگی یا دوستانه‌ات فوروارد شده فکر کن. کدام‌یک را بدون چک کردن باور کردی، فقط چون فرستنده‌اش کسی بود که به او اعتماد داری؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۲ — کشف نفع پنهان پشت ادعا (Cui bono)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 2
  tag: "فصل ۲ — نفع پنهان"
  title: "چه کسی از این خوشش می‌آید؟"
  body: >
    صبح، درحالی‌که قهوه‌ات را می‌خوری، گوشی را باز می‌کنی. یک سایت خبری اقتصادی تیتر زده: «کارشناسان می‌گویند: بهترین زمان برای خرید طلا همین الان است، قبل از جهش بزرگ قیمت.» متن پر است از نقل‌قول‌هایی با لحن مطمئن — «تحلیلگران ارشد بازار»، «روند صعودی غیرقابل‌انکار». حسی از فوریت در تو بیدار می‌شود؛ پس‌اندازِ کوچکی که ماه‌ها کنار گذاشته‌ای، ناگهان در معرض «از دست دادنِ فرصت» به نظر می‌رسد. تصمیم می‌گیری همین امروز به صرافی سر بزنی. درست وقتی داری اسکرول را قطع می‌کنی تا لینک صرافی را باز کنی، چشمت به پایین صفحه می‌افتد: یک بنر تبلیغاتی، همان صرافی، همان رنگ‌بندی، با شعار «امروز طلا بخر، فردا پشیمان نشو.» برای یک لحظه دستت روی صفحه می‌ماند — انگار چیزی در ذهنت جابه‌جا شده، اما هنوز نمی‌دانی دقیقاً چه چیزی.
  prompt: "فارغ از اینکه ادعا درست است یا نه — اگر تو همین الان طلا بخری، دقیقاً چه کسانی از این تصمیم سود می‌برند؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. هدف: کاربر پیش از پرسیدن «آیا این درست است؟» یاد بگیرد بپرسد «چه کسی سود می‌برد؟»
    - اگر کاربر فقط به محتوای خبر پرداخت و تبلیغ را کنار متن ندید یا اهمیت نداد:
      «تو داری فقط به ‹چه گفته شد› نگاه می‌کنی. یک قدم به عقب برو: این خبر کنار چه چیزی منتشر شده؟»
    - اگر کاربر تبلیغ کنار متن را دید و به آن اشاره کرد:
      «دقیقاً. این به این معنا نیست که ادعا لزوماً دروغ است — شاید واقعاً قیمت طلا بالا برود.
      اما وقتی منبعی که خبر را می‌دهد از باور تو به آن خبر مستقیم سود می‌برد،
      چه چیزی باید در روش خواندن تو تغییر کند؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "مغالطه‌ی نفع پنهان / Cui Bono (به سود کیست؟)"
    takeaway: >
      «Cui bono» یک اصل قدیمی حقوقی است به معنای «به سود کیست؟» — و ابزاری قدرتمند برای
      نگاه به هر ادعاست، جدا از خود ادعا. سؤال «آیا این حرف درست است؟» تو را داخل محتوا
      نگه می‌دارد؛ سؤال «اگر این حرف را باور کنم، چه کسی سود می‌برد؟» تو را یک قدم عقب
      می‌برد تا کل صحنه را ببینی، نه فقط متن.


      نکته‌ی مهم این است که وجود نفع مالی، ادعا را خودکار دروغ نمی‌کند. قیمت طلا واقعاً
      هم می‌تواند بالا برود. اما وقتی گوینده‌ی خبر همان کسی است که از باور تو سود می‌برد،
      بار اثبات باید سنگین‌تر شود — همان‌طور که شهادت یک شاهد که خودش هم متهم پرونده است،
      وزن متفاوتی از یک شاهد بی‌طرف دارد.


      این الگو همه‌جا تکرار می‌شود: مقاله‌ای که محصولی را تحسین می‌کند و پایینش لینک
      فروش همان محصول است؛ فردی که یک سرمایه‌گذاری را توصیه می‌کند و خودش قبلاً روی
      همان سرمایه‌گذاری پول گذاشته. مهارت واقعی این نیست که به همه چیز بدبین باشی،
      بلکه این است که همیشه یک لایه‌ی اضافه بپرسی: «این حرف از کجا می‌آید، و آن‌جا چه کسی
      منتفع می‌شود؟»
    exercise:
      prompt: "دفعه‌ی بعد که یک توصیه‌ی خرید یا سرمایه‌گذاری دیدی، قبل از هر چیز فقط این را پیدا کن: گوینده‌ی این توصیه، اگر تو آن را انجام بدهی، دقیقاً چقدر و چطور سود می‌برد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۳.۱ — اثر هاله‌ای (Halo Effect)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 3
  tag: "فصل ۳ — سوگیری‌های شناختی"
  title: "توصیه‌ی مالی رفیق"
  body: >
    توی کافه نشسته‌اید. نزدیک‌ترین دوستت — همانی که سر کارش رشد کرده، همانی که هر
    تصمیم بزرگ زندگی‌اش، از انتخاب دانشگاه تا خرید خانه، به‌طرز عجیبی درست از آب
    درآمده — با چشم‌هایی برق‌زده خم می‌شود روی میز: «یه سهم پیدا کردم، مطمئنم صد در
    صد سود می‌کنی. الان وقتشه، دیر نکن.» صدایش پر از اطمینان است، همان اطمینانی که
    همیشه داشته و همیشه هم جواب داده. دستت می‌رود سمت گوشی تا اپلیکیشن بورس را باز
    کنی. یک لحظه مکث می‌کنی — نه چون به او شک داری، که برعکس، دقیقاً چون به او مطمئنی
    و همین اطمینان غریب است. تا حالا هیچ‌وقت از او پرسیده‌ای «این تحلیلت رو از کجا
    آوردی؟» چون همیشه حس کرده‌ای پرسیدن این سؤال، انگار به رفاقتتان بی‌احترامی است.
  prompt: "اگر همین جمله را یک آشنای دور که کمتر بهش اعتماد داری می‌گفت، همین‌قدر جدی می‌گرفتیش؟ چرا؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد اثر هاله‌ای (Halo Effect) را از طریق تجربه کشف می‌کند.
    - اگر کاربر تفاوت را انکار کرد یا گفت فرقی نمی‌کند:
      «چطور ‹باهوش بودن گوینده در کارش› ناخودآگاه به ‹باهوش بودن در همه‌ی حوزه‌ها› تعمیم داده می‌شود؟»
    - اگر کاربر تفاوت را پذیرفت و اعتراف کرد که دوستش را جدی‌تر می‌گیرد:
      «این تعمیم از کجا می‌آید؟ آیا موفقیت او در کارش، تخصصی در تحلیل بورس هم به او می‌دهد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "اثر هاله‌ای (Halo Effect)"
    takeaway: >
      اثر هاله‌ای زمانی رخ می‌دهد که یک ویژگی مثبتِ کسی — مثلاً موفقیت شغلی، جذابیت،
      یا اعتماد شخصی که به او داریم — ناخودآگاه روی قضاوت ما درباره‌ی سایر ویژگی‌های
      او سایه می‌اندازد، حتی در حوزه‌هایی که ربطی به آن ویژگی اول ندارند. کسی که در
      کارش موفق است، لزوماً در تحلیل بورس، پزشکی، یا تربیت فرزند هم متخصص نیست —
      اما مغز ما این‌طور رفتار نمی‌کند.


      این سوگیری خصوصاً درباره‌ی افراد نزدیک خطرناک‌تر است، چون با «اعتماد شخصی»
      قاطی می‌شود. وقتی از یک غریبه توصیه‌ی مالی می‌شنویم، طبیعی است که بپرسیم
      «مدرکت چیه؟» اما پرسیدن همین سؤال از نزدیک‌ترین دوستمان، حسی از بی‌اعتمادی
      یا بی‌احترامی القا می‌کند — درحالی‌که این دو موضوع کاملاً جدا هستند: می‌توانی
      کاملاً به شخصیت و صداقت کسی اعتماد داشته باشی و همزمان از تخصص فنی‌اش در یک
      حوزه‌ی خاص مطمئن نباشی.


      راه مقابله با این تله ساده اما ناخوشایند است: سؤال «مدرکت چیه؟» یا «این تحلیل
      رو از کجا آوردی؟» را از یک نشانه‌ی بی‌اعتمادی به یک عادت استاندارد تبدیل کنی —
      چیزی که از همه می‌پرسی، نه فقط از کسانی که کمتر می‌شناسی.
    exercise:
      prompt: "یک نفر در زندگی‌ات را به یاد بیاور که چون در یک زمینه موفق بوده، حرفش را در زمینه‌ای کاملاً دیگر بدون چک کردن پذیرفتی. آن دو زمینه واقعاً چقدر به هم ربط داشتند؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۳.۲ — دسترس‌پذیری (Availability Heuristic)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 4
  tag: "فصل ۳ — سوگیری‌های شناختی"
  title: "خبر ترسناکی که همه جا می‌بینی"
  body: >
    دوشنبه صبح، همسایه‌ی طبقه‌ی پایین توی آسانسور می‌گوید: «دیشب ماشین یکی رو تو کوچه
    دزدیدن، شنیدی؟» ظهر همان روز، در استوری یکی از دوستانت یک پست ریپست شده می‌بینی:
    «سرقت خودرو در محله‌ی X، مراقب باشید.» عصر، در گروه تلگرامی محله، یک عکس از قفل
    شکسته‌ی یک ماشین دست‌به‌دست می‌شود، با کپشن «اینجا دیگه امن نیست.» تا شب، حسی از
    نگرانی در تو نشسته که پیش از این نبود. وقتی می‌خواهی ماشینت را جلوی در پارک کنی،
    دو بار برمی‌گردی مطمئن شوی درها قفل است. فکر می‌کنی شاید وقتش رسیده دنبال پارکینگ
    بگردی، یا حتی جای زندگی‌ات را عوض کنی. سه خبر، سه منبع مختلف — اما همه درباره‌ی
    یک اتفاق، یا سه اتفاق جدا؟ خودت هم دقیق نمی‌دانی.
  prompt: "چقدر مطمئنی که نرخ واقعی سرقت در محله‌ات واقعاً بالا رفته، در برابر اینکه فقط این بار بیشتر متوجهش شدی؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Availability Heuristic را از طریق تجربه کشف می‌کند.
    - اگر کاربر بین «تکرار دیده‌شدن» و «افزایش واقعی وقوع» فرق نگذاشت:
      «مغز، تعداد دفعاتی که چیزی را به خاطر می‌آورد را با احتمال واقعی وقوعش اشتباه می‌گیرد.
      اگر همین هفته آماری واقعی می‌دیدی که نشان می‌دهد سرقت کمتر شده، حس ناامنی‌ات فوراً از بین می‌رفت؟»
    - اگر کاربر فرق را دید:
      «چرا مغز، فراوانی چیزی که به خاطر می‌آورد را با فراوانی واقعی آن در دنیا اشتباه می‌گیرد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "اکتشاف دسترس‌پذیری (Availability Heuristic)"
    takeaway: >
      مغز ما احتمال وقوع یک اتفاق را نه بر اساس آمار واقعی، بلکه بر اساس این‌که «چقدر
      راحت مثالی از آن به یادمان می‌آید» می‌سنجد. اگر سه بار در یک روز درباره‌ی سرقت
      خودرو بشنویم، حتی اگر هر سه به یک اتفاق واحد اشاره کنند، مغز آن را با «سرقت
      زیاد شده» یکی می‌گیرد — چون به‌خاطر آوردنش آسان شده، نه چون واقعاً بیشتر رخ داده.


      این اکتشاف در دنیای شبکه‌های اجتماعی به‌شدت تشدید می‌شود، چون یک اتفاق واحد
      می‌تواند از مسیرهای متعدد (همسایه، استوری، گروه تلگرام) به ما برسد و حس تکرار
      بدهد، درحالی‌که منبع همه یکی است. نتیجه این می‌شود که حس ناامنی‌مان از واقعیتِ
      آماری جلو می‌زند.


      این سوگیری همیشه بد نیست — گاهی همان چیزی است که ما را هوشیار نگه می‌دارد.
      اما وقتی تصمیم مهمی (مثل جابه‌جایی، تغییر شغل، یا قطع رابطه با کسی) را فقط بر
      اساس «چیزهایی که این هفته زیاد دیده‌ام» می‌گیریم، باید بپرسیم: این حس از آمار
      واقعی می‌آید، یا فقط از این‌که این هفته بیشتر متوجهش شده‌ام؟
    exercise:
      prompt: "یک ترسِ اخیرت را به یاد بیاور که از دیدن یک خبر یا موضوع تکراری در فضای مجازی شکل گرفت. اگر آماری واقعی و مستقل درباره‌ی آن موضوع پیدا می‌کردی، فکر می‌کنی چه چیزی نشان می‌داد؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۴ — چرا ترفندها کار می‌کنند (انگیزه‌ی استفاده‌کننده)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 5
  tag: "فصل ۴ — معماری ترفند"
  title: "معماری یک تهدید نرم"
  body: >
    قرار بود امشب همدیگر را ببینید، اما یک ددلاین کاری غیرمنتظره سر راهت سبز شده.
    پیام می‌دهی: «عزیزم امشب نمی‌تونم بیام، باید این کار رو تموم کنم.» چند دقیقه سکوت.
    بعد جواب می‌آید: «باشه، مشکلی نیست.» ولی خودت می‌دانی که «باشه»اش چه معنایی دارد.
    یک پیام دیگر می‌آید: «اگه واقعاً دوستم داشتی، همین امشب کنارم بودی.» معده‌ات جمع
    می‌شود. یک بخش از ذهنت شروع می‌کند به دفاع از خودت — لیست کردن همه‌ی دفعاتی که
    برایش وقت گذاشته‌ای، همه‌ی شب‌هایی که کارت را کنار گذاشته‌ای برای او. بخش دیگری از
    ذهنت دارد از کارت جا می‌ماند، اما انگشتانت روی گوشی معلق مانده‌اند، چون نمی‌دانی
    اگر همین حالا جواب ندهی، امشب و فردا چه شکلی خواهد بود.
  prompt: "فارغ از ساختار منطقی این جمله — این جمله چه چیزی از تو می‌خواهد بگیرد؟ حق با او بودن، یا کنترل رفتار تو؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد می‌فهمد که یک ترفند استدلالی وقتی «کار می‌کند» که
    یک فشار روانی واقعی پشتش باشد — ترس از قضاوت‌شدن، ترس از رها‌شدن.
    - اگر کاربر فقط ساختار منطقی جمله را تحلیل کرد (مثل کورس منطق):
      «تو داری دوباره فقط منطق جمله را می‌بینی. این بار سؤال فرق دارد:
      این جمله در عمل، چه رفتاری از تو می‌خواهد بیرون بکشد؟»
    - اگر کاربر انگیزه/فشار پشت جمله را دید:
      «دقیقاً. این جمله لزوماً دروغ نیست، اما کارکردش کنترل کردن تصمیم توست، نه بیان یک حقیقت.
      اگر همین جمله از یک رئیس شنیده می‌شد، همان کارکرد را داشت؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "استدلال به‌عنوان ابزار کنترل (Argument as Control / Guilt-Tripping)"
    takeaway: >
      نه هر جمله‌ای که ساختار «اگر… پس…» دارد، هدفش رسیدن به حقیقت است. برخی جملات در ظاهر استدلال‌اند، اما کارکرد واقعی‌شان چیز دیگری‌ست: گرفتن یک رفتار خاص از طرف مقابل، از طریق فعال‌کردن احساس گناه یا ترس. جمله‌ی «اگه واقعاً دوستم داشتی…» از نظر منطقی قابل بحث است، اما نکته‌ی اصلی این نیست — نکته این است که این جمله طراحی شده تا تو را از فکر کردن منصرف کند و مستقیم به عمل برساند.


      تفاوت اصلی بین «استدلال صادقانه» و «استدلال کنترل‌گر» در این است که استدلال صادقانه به تو فضای فکر کردن می‌دهد، اما استدلال کنترل‌گر عجله می‌کند — یک فوریت احساسی می‌سازد که هر مکثی را شبیه «رد شدن» جلوه می‌دهد. وقتی حس می‌کنی مکث‌کردن هم نوعی گناه است، احتمالاً داری با یک ابزار کنترل روبه‌رو می‌شوی، نه یک بحث واقعی.


      یک تست ساده برای تشخیص این الگو: همان جمله را در ذهنت از دهان یک نفرِ دیگر — رئیس، همکار، یا آشنای دور — تصور کن. اگر همان جمله در آن موقعیت عجیب یا حتی زورگویانه به نظر می‌رسد، احتمالاً کارکردش کنترل بوده، نه بیان یک حقیقت ساده.
    exercise:
      prompt: "به یک جمله‌ی اخیر فکر کن که بعد از شنیدنش حس گناه کردی و سریع رفتارت را عوض کردی. اگر همان جمله را یک آشنای دور می‌گفت، همان‌قدر جدی می‌گرفتیش؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۵ — شواهد ذینفع (Conflict of Interest)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 6
  tag: "فصل ۵ — شواهد ذینفع"
  title: "تحقیقی که شرکت پرداختش کرده"
  body: >
    ماه‌هاست دنبال راهی برای کاهش وزن می‌گردی، بدون نتیجه‌ی چندانی. توی اسکرول شب،
    یک پست اینستاگرامی توجهت را جلب می‌کند: «طبق تحقیق جدید، رژیم X باعث کاهش
    ۲۰ کیلویی وزن در سه ماه می‌شود.» عکسِ قبل‌وبعد، نمودار رنگی، و کلی کامنت از
    آدم‌هایی که می‌نویسند «من امتحان کردم، جواب داد.» انگشتت آماده است لینک خرید مکمل
    را باز کنی — تا اینکه زیر پست، با فونت کوچک‌تر، یک خط می‌بینی: «این تحقیق توسط
    شرکت سازنده‌ی مکمل X تأمین مالی شده است.» برای یک ثانیه مکث می‌کنی. عدد ۲۰ کیلو
    هنوز همان‌قدر وسوسه‌انگیز است، کامنت‌های مثبت هنوز همان‌جا هستند، اما آن یک خط
    کوچک، جایی در ذهنت، چیزی را جابه‌جا کرده است.
  prompt: "موضوع کافی‌بودن نمونه نیست. سؤال این است: وقتی تولیدکننده‌ی محصول، خودش هزینه‌ی تحقیق اثبات آن محصول را می‌دهد، این چه چیزی به روایی نتیجه اضافه یا کم می‌کند؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد Conflict of Interest را تشخیص می‌دهد.
    - اگر کاربر گفت فرقی نمی‌کند کی پولش را داده:
      «شرکت‌هایی که محصولشان را تحقیق می‌کنند، همیشه انگیزه دارند نتیجه‌ی مثبت پیدا کنند.
      این به خودی‌خود تحقیق را دروغ نمی‌کند، اما باید با شک بیشتری خوانده شود. چرا فکر می‌کنی این تفاوت مهم است؟»
    - اگر کاربر تضاد منافع را تشخیص داد:
      «دقیقاً. اگر همین تحقیق را یک دانشگاه مستقل انجام داده بود، همان اعتماد را داشتی؟
      چه چیزی در بین این دو تغییر کرده — دقت علمی، یا کسی که نتیجه را می‌خواهد؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "تضاد منافع در شواهد (Conflict of Interest)"
    takeaway: >
      تضاد منافع به این معنا نیست که یک تحقیق حتماً دروغ است، بلکه به این معناست که
      انگیزه‌ی مالی نتیجه‌گیرنده، می‌تواند — حتی بدون قصد آگاهانه — روی نحوه‌ی طراحی
      آزمایش، انتخاب داده‌ها، و بیان نتایج اثر بگذارد. یک شرکت که هزینه‌ی تحقیق اثبات
      محصول خودش را می‌دهد، معمولاً فقط تحقیق‌هایی را منتشر می‌کند که نتیجه‌ی خوب
      می‌دهند و تحقیق‌های ناموفق را کنار می‌گذارد — پدیده‌ای که به آن «سوگیری انتشار»
      می‌گویند.


      نکته‌ی مهم این است که وجود تضاد منافع، بار اثبات را سنگین‌تر می‌کند، نه اینکه
      نتیجه را خودکار باطل کند. سؤال درست «آیا این تحقیق دروغ است؟» نیست، بلکه
      «آیا این نتیجه توسط پژوهشگران مستقل دیگر هم تکرار شده؟» است. تحقیقی که فقط
      یک‌بار و فقط توسط ذی‌نفع اصلی منتشر شده، وزن علمی بسیار کمتری از تحقیقی دارد
      که چند بار توسط گروه‌های مستقل تکرار شده.


      در زندگی روزمره، این الگو را همه‌جا می‌بینی: شرکت دارویی که اثربخشی داروی
      خودش را تحقیق می‌کند، برند لوازم آرایشی که «مطالعه‌ی بالینی» محصول خودش را
      منتشر می‌کند. عادت کوچک اما مؤثر این است که همیشه اسکرول کنی تا ببینی چه کسی
      پول این تحقیق را داده — همان‌طور که در این داستان، آن یک خط کوچک زیر پست.
    exercise:
      prompt: "دفعه‌ی بعد که یک ادعای علمی یا آماری دیدی که محصولی را تبلیغ می‌کند، فقط دنبال یک چیز بگرد: تحقیق پشت آن ادعا را چه کسی تأمین مالی کرده؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۶ — کشف حباب خودت (Filter Bubble)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 7
  tag: "فصل ۶ — حباب اطلاعاتی"
  title: "کیست که به من می‌گوید؟"
  body: >
    فانوس این بار داستانی روایت نمی‌کند، از تو می‌خواهد یک کار واقعی انجام دهی.
    گوشی‌ات را برمی‌داری، اینستاگرام یا تلگرام را باز می‌کنی، و به صفحه‌ی اصلی نگاه
    می‌کنی — همان جایی که هر روز، بدون فکر کردن، اسکرول می‌کنی. سعی می‌کنی سه صفحه
    یا کانالی را که بیشترین محتوای خبری یا تحلیلی‌ات از آن‌ها می‌آید، نام ببری. عجیب
    است — تا حالا هیچ‌وقت این‌طور آگاهانه به لیست منابعت فکر نکرده بودی. آن‌ها همیشه
    همین‌جا بوده‌اند، همیشه در دسترس، و تو هیچ‌وقت نپرسیده بودی چرا دقیقاً همین‌ها،
    و نه ده‌ها کانال دیگری که هیچ‌وقت ندیده‌ای.
  prompt: "این سه منبع که نوشتی — چقدر با هم دیدگاه سیاسی، اقتصادی، یا اجتماعی مشابهی دارند؟ فکر می‌کنی الگوریتم چرا این‌ها را به تو بیشتر نشان می‌دهد؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد حباب اطلاعاتی خودش را کشف می‌کند.
    - اگر کاربر گفت منابعش متنوع است:
      «خوبه. حالا صادقانه به آخرین باری که واقعاً نظرت را بعد از خواندن یکی از این منابع
      عوض کردی فکر کن — کی بود؟»
    - اگر کاربر متوجه شباهت منابعش شد:
      «این دقیقاً چیزی است که اکثر ما نمی‌بینیم چون از درون حباب، حباب دیده نمی‌شود.
      الگوریتم چیزی را بیشتر نشان می‌دهد که تو بیشتر با آن تعامل کنی — این یعنی چیزی که
      ‹بیشتر می‌بینی› لزوماً واقعی‌ترین تصویر از دنیا نیست.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "حباب فیلتر (Filter Bubble)"
    takeaway: >
      الگوریتم‌های شبکه‌های اجتماعی برای یک هدف ساده طراحی شده‌اند: نگه‌داشتن تو
      روی صفحه‌ی هر چه بیشتر. برای این کار، آن‌ها یاد می‌گیرند چه چیزی باعث می‌شود
      بیشتر توقف کنی، لایک بزنی، یا کامنت بگذاری — و همان الگو را بیشتر نشانت می‌دهند.
      نتیجه این می‌شود که با گذشت زمان، صفحه‌ی اصلی هرکس شبیه یک اتاق پژواک می‌شود:
      جایی که بیشتر چیزهایی که می‌بینی، با چیزهایی که از قبل باور داشتی هم‌خوانی دارند.


      خطرناک‌ترین بخش حباب فیلتر این است که از درونش دیده نمی‌شود. چون هرچه می‌بینی
      منطقی، متعادل، و «همان چیزی که همه می‌گویند» به نظر می‌رسد — درحالی‌که فقط
      بازتاب انتخاب‌های قبلی خودت است. کسی که در حباب دیگری زندگی می‌کند، همان حس
      اطمینان را درباره‌ی تصویر کاملاً متفاوتی از دنیا دارد.


      راه خروج از این تله، حذف شبکه‌های اجتماعی نیست، بلکه عادت به پرسیدن دو سؤال
      است: «این منبع، چه دیدگاهی را بیشتر از دیدگاه‌های دیگر به من نشان می‌دهد؟» و
      «آخرین باری که یک منبع واقعاً نظرم را عوض کرد، کی بود؟» اگر جواب سؤال دوم
      «هیچ‌وقت» است، احتمالاً منابعت فقط دارند حرف‌های خودت را با صدای بلندتر تکرار می‌کنند.
    exercise:
      prompt: "همان سه منبعی که نام بردی را کنار بگذار و یک منبع خبری یا تحلیلی جدید پیدا کن که می‌دانی دیدگاهی متفاوت از منابع همیشگی‌ات دارد. یک هفته آن را هم دنبال کن و ببین چه چیزی برایت تازه است."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۷ — مشروعیت «نمی‌دانم» (تفکر در ابهام)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 8
  tag: "فصل ۷ — تفکر در ابهام"
  title: "انتخاب بدون اطلاعات کامل"
  body: >
    دو پیشنهاد شغلی روی میزت است. یکی حقوق ثابت، بیمه، امنیت شغلی مطمئن. دیگری یک
    استارتاپ کوچک با پتانسیل رشد بالا، اما ریسک واقعی — ممکن است شرکت تا یک سال دیگر
    حتی وجود نداشته باشد. مادرت هر شب زنگ می‌زند و می‌پرسد «خب بالاخره کدومو انتخاب
    کردی؟» دوستانت در گروه می‌نویسند «چیشد پس؟ ما هم منتظریم بدونیم.» همه انتظار یک
    جواب قاطع دارند، یک تصمیم روشن که بتوانی با اطمینان اعلامش کنی. اما هر بار که
    می‌خواهی جواب بدهی، حس می‌کنی هنوز نمی‌دانی — و همین «نمی‌دانم» گفتن، به‌جای
    اینکه راحتت کند، حس ضعف و بی‌تصمیمی به تو می‌دهد، انگار باید یک آدم قوی‌تر
    بودی که تا الان تصمیمش را گرفته بود.
  prompt: "با اطلاعاتی که الان داری، آیا واقعاً می‌توانی مطمئن باشی کدام گزینه بهتر است؟ چه حسی داری وقتی جوابت این است: «هنوز نمی‌دانم»؟"
  ai_socratic_prompt: |
    تو «فانوس» هستی. کاربر دارد یاد می‌گیرد «نمی‌دانم» را زیر فشار اجتماعی به‌عنوان
    یک پاسخ معتبر بپذیرد، نه نشانه‌ی ضعف.
    - اگر کاربر به‌خاطر فشار اجتماعی یک جواب ساختگی قاطع داد:
      «تو الان به‌جای بیان باور واقعی‌ات، چیزی گفتی که دیگران راحت‌تر بپذیرندش.
      چرا ‹هنوز نمی‌دانم› برایت جواب ضعیفی به نظر می‌رسد؟»
    - اگر کاربر عدم قطعیت را پذیرفت:
      «این دقیقاً یک پاسخ معتبر است — نه ضعف، بلکه صداقت با سطح واقعی اطلاعاتی که داری.
      چرا فکر می‌کنی کسی که می‌گوید ‹نمی‌دانم› ضعیف‌تر به نظر می‌رسد از کسی که با اطمینان
      کاذب یک طرف را انتخاب می‌کند؟»
    هرگز نگو درست یا غلط. فقط فارسی، در ۲ تا ۴ جمله.
  lesson:
    concept_name: "مشروعیت عدم قطعیت (Epistemic Humility / Comfort with Not Knowing)"
    takeaway: >
      فرهنگ اجتماعی ما معمولاً قاطعیت را با هوشمندی و «نمی‌دانم» را با ضعف یکی می‌گیرد.
      این معادله‌سازی اشتباه است. کسی که با اطلاعات ناقص، یک طرف را با اطمینان کاذب
      انتخاب می‌کند، دارد چیزی را وانمود می‌کند که ندارد. کسی که می‌گوید «هنوز نمی‌دانم،
      دارم اطلاعات جمع می‌کنم» در واقع دارد سطح واقعی دانش خودش را صادقانه گزارش می‌دهد.


      این فشار اجتماعی برای قاطعیت، اغلب باعث می‌شود آدم‌ها زودتر از موقع تصمیم بگیرند
      — نه چون اطلاعات کافی دارند، بلکه چون تحمل نگاه‌های منتظر اطرافیان را ندارند.
      نتیجه، تصمیم‌هایی است که بیشتر برای راحت‌کردن دیگران گرفته می‌شوند تا برای
      خود فرد.


      تفکر بالغانه یعنی بتوانی سطح اطمینانت را با سطح واقعی شواهدت هماهنگ نگه داری —
      نه بیشتر مطمئن باش از آنچه شواهد اجازه می‌دهند، نه کمتر. «نمی‌دانم» گفتن در
      جای درست، نشانه‌ی دقتِ فکری‌ست، نه غیبتِ آن.
    exercise:
      prompt: "به یک تصمیم اخیر فکر کن که زودتر از موقع، فقط به‌خاطر فشار اطرافیان برای «جواب قاطع دادن»، گرفتی. اگر کسی منتظرت نبود، چقدر بیشتر صبر می‌کردی؟"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # فصل ۸ — پرونده‌ی فانوس (جمع‌بند کل کورس)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- order: 9
  tag: "فصل ۸ — پرونده‌ی فانوس"
  title: "پرونده"
  body: >
    فانوس این بار یک «پرونده» جلوی تو می‌گذارد، نه یک سؤال. چهار تکه‌ی به‌هم مرتبط
    روی میز است. اول، پستی از یک اینفلوئنسر مالی که با اطمینان یک ارز دیجیتال خاص
    را تبلیغ می‌کند و پایین پستش با فونت ریز نوشته شده «تبلیغ پولی». دوم، یک خبر داغ
    که در سه منبع خبری مختلف، سه روایت کمی متفاوت از آن پخش شده. سوم، پیامی از مادرت
    که با نگرانی واقعی — نه بحث، نگرانی — نوشته «مامان جان، تو رو خدا تو این تصمیم
    مالی به حرف بزرگ‌ترها گوش کن.» و چهارم، خودِ تصمیم: پول کوچکی که پس‌انداز کرده‌ای،
    و باید تصمیم بگیری آیا وارد آن ارز دیجیتال می‌شوی یا نه، همین امشب، قبل از اینکه
    به‌قول اینفلوئنسر «فرصت از دست برود.»
  prompt: "این بار فانوس مرحله‌به‌مرحله راهنمایی نمی‌کند. فقط می‌پرسد: چه سؤال‌هایی باید بپرسی، قبل از اینکه تصمیم بگیری؟ خودت مسیر تحلیل را پیدا کن."
  ai_socratic_prompt: |
    تو «فانوس» هستی و این مأموریت جمع‌بند کل کورس است. کاربر باید همه‌ی مهارت‌ها را
    با هم به‌کار ببرد: انگیزه‌ی فرستنده، Cui bono، سوگیری‌های شناختی، استدلال به‌عنوان
    ابزار کنترل، تضاد منافع، حباب اطلاعاتی، و تفکر در ابهام.
    این بار ارزیابی کیفی بده، نه مسیریابی دوگانه:
    - اگر تضاد منافع اینفلوئنسر را دید اما فشار خانواده را بدون بررسی پذیرفت یا رد کرد:
      «تو در دیدن نفع پنهان اینفلوئنسر قوی عمل کردی. اما وقتی نوبت به پیام خانواده رسید،
      همان دقت را نداشتی. وقتی موضوع احساسی می‌شود، سرعت نتیجه‌گیری‌ات بالا می‌رود.»
    - اگر همه‌ی لایه‌ها را با هم دید:
      «تو نفع پنهان، تناقض روایت‌ها، و فشار عاطفی را جداگانه بررسی کردی —
      این دقیقاً همان چیزی است که تفکر انتقادی واقعی از تفکر انتقادی انتخابی جدا می‌کند.»
    هرگز نگو درست یا غلط. فقط فارسی، در ۳ تا ۵ جمله.
  lesson:
    concept_name: "تفکر انتقادی یکپارچه (Integrated Critical Thinking)"
    takeaway: >
      هشت مهارتی که تا اینجا تمرین کردی — دیدن انگیزه‌ی فرستنده، پرسیدن Cui bono،
      شناسایی اثر هاله‌ای و اکتشاف دسترس‌پذیری، تشخیص استدلال به‌عنوان ابزار کنترل،
      دیدن تضاد منافع، آگاهی از حباب اطلاعاتی، و پذیرفتن «نمی‌دانم» — به‌تنهایی مفید
      هستند، اما قدرت واقعی‌شان
      وقتی آشکار می‌شود که همزمان و روی یک موقعیت واحد به‌کار بروند.


      بزرگ‌ترین دام تفکر انتقادی این است که آدم‌ها این مهارت‌ها را «انتخابی» به‌کار
      می‌برند — تیزبین و بی‌رحم در تحلیل ادعایی که از قبل به آن شک داشتند (مثل پست
      اینفلوئنسر)، اما کاملاً بی‌دقت در برابر ادعایی که از منبعی احساسی و نزدیک می‌آید
      (مثل نگرانی مادر). این را «تفکر انتقادی موتیوه‌شده» می‌نامند — استفاده از
      ابزارهای تحلیلی نه برای رسیدن به حقیقت، بلکه برای تأیید چیزی که از قبل می‌خواستیم باور کنیم.


      تفکر انتقادی واقعی، سازگار است: همان دقتی که برای رد‌کردن حرف یک غریبه به‌کار
      می‌بری، باید برای بررسی حرف عزیزترین آدم زندگی‌ات هم به‌کار برود — نه برای
      بی‌احترامی به او، بلکه چون خودِ حقیقت، به منبعش اهمیت نمی‌دهد.
    exercise:
      prompt: "یک تصمیم واقعی که این هفته یا ماه پیش رو داری را بردار و چهار سؤالی که در این کورس یاد گرفتی (انگیزه‌ی گوینده، نفع پنهان، تضاد منافع، سطح واقعی اطمینانت) را رویش پیاده کن — روی کاغذ، نه فقط در ذهن."
