<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فانوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ece4d4;
    --paper-deep:#e2d8c3;
    --ink:#2c2820;
    --ink-soft:#5c5442;
    --olive:#47502f;
    --olive-deep:#363c22;
    --flame:#e0a458;
    --flame-soft:rgba(224,164,88,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background-color: #f5f0e8;
    background-image:
      linear-gradient(rgba(200,180,140,0.45) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,180,140,0.45) 1px, transparent 1px);
    background-size: 32px 32px;
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  /* پرتوی نرم روی گرید برای حفظ عمق */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,252,240,0.65) 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .frame{
    position:relative;
    z-index:1;
    text-align:center;
    padding:48px 32px;
    max-width:520px;
  }
  .lantern{
    width:150px;
    height:auto;
    margin:0 auto 8px;
    display:block;
  }
  .lantern-path{
    fill:none;
    stroke:var(--ink);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* پرتوی گرم که با روشن شدن فانوس روی کل صفحه پخش می‌شود */
  .warm-overlay{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(224,164,88,0.22) 0%, rgba(224,164,88,0.06) 40%, transparent 72%);
    opacity:0;
    transition:opacity 1.6s ease;
  }
  .warm-overlay.active{ opacity:1; }

  /* مداد در حال کشیدن خطوط */
  .pencil{
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .pencil.active{ opacity:1; }
  .pencil.exit{
    opacity:0;
    transition:opacity 0.45s ease, transform 0.45s ease;
    transform:translate(6px,-6px) scale(0.9);
  }
  .pencil-body{
    fill:none;
    stroke:var(--ink-soft);
    stroke-width:1.1;
    stroke-linecap:round;
  }
  .pencil-tip{
    fill:var(--ink);
  }

  /* جرقه‌ی اولیه */
  .spark{
    opacity:0;
    transform-origin:103.9px 155px;
  }
  .spark.active{
    animation:sparkFlash 0.5s ease forwards;
  }
  @keyframes sparkFlash{
    0%{ opacity:0; transform:scale(0.2); }
    35%{ opacity:1; transform:scale(2.6); }
    100%{ opacity:0; transform:scale(3.4); }
  }

  /* شکل‌گیری تدریجی شعله */
  .flame-shape{
    fill:var(--flame);
    opacity:0;
    transform-origin:103.9px 165px;
    transform:scale(0.15);
  }
  .flame-shape.active{
    animation:flameGrow 1.1s cubic-bezier(.25,.9,.35,1.15) forwards, flicker 4.5s ease-in-out 1.1s infinite;
  }
  @keyframes flameGrow{
    0%{ opacity:0; transform:scale(0.1); }
    55%{ opacity:1; transform:scale(1.15); }
    100%{ opacity:1; transform:scale(1); }
  }

  .flame-glow{
    opacity:0;
    transform-origin:center;
  }
  .flame-glow.lit{
    animation:glowIn 1.4s ease forwards, flicker 4.5s ease-in-out 1.4s infinite;
  }
  @keyframes glowIn{
    from{ opacity:0; }
    to{ opacity:0.85; }
  }
  @keyframes flicker{
    0%,100%{ opacity:0.85; transform:scale(1); }
    45%{ opacity:1; transform:scale(1.05); }
    60%{ opacity:0.75; transform:scale(0.97); }
  }

  /* بازتاب نور روی شیشه‌ی فانوس */
  .flame-reflection{
    opacity:0;
    mix-blend-mode:screen;
    transition:opacity 1.4s ease;
  }
  .flame-reflection.active{ opacity:0.55; }

  /* ذرات نور شناور */
  .particle{
    opacity:0;
    fill:var(--flame);
  }
  .particles.active .particle{ animation-play-state:running; }
  .particles .particle{
    animation:none;
  }
  .particles.active .p1{ animation:floatUp1 4.2s ease-in infinite; animation-delay:0s; }
  .particles.active .p2{ animation:floatUp2 4.8s ease-in infinite; animation-delay:0.9s; }
  .particles.active .p3{ animation:floatUp3 3.9s ease-in infinite; animation-delay:1.8s; }
  .particles.active .p4{ animation:floatUp1 5.2s ease-in infinite; animation-delay:2.5s; }
  .particles.active .p5{ animation:floatUp2 4.4s ease-in infinite; animation-delay:0.4s; }
  @keyframes floatUp1{
    0%{ opacity:0; transform:translate(0,0) scale(0.6); }
    15%{ opacity:0.9; }
    100%{ opacity:0; transform:translate(-6px,-95px) scale(0.3); }
  }
  @keyframes floatUp2{
    0%{ opacity:0; transform:translate(0,0) scale(0.5); }
    18%{ opacity:0.8; }
    100%{ opacity:0; transform:translate(8px,-105px) scale(0.25); }
  }
  @keyframes floatUp3{
    0%{ opacity:0; transform:translate(0,0) scale(0.7); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translate(-2px,-80px) scale(0.2); }
  }

  h1{
    font-size:52px;
    font-weight:700;
    color:var(--olive);
    margin:18px 0 6px;
    letter-spacing:0.02em;
    opacity:0;
    transition:text-shadow 1.4s ease;
  }
  h1.show{ animation:fadeUp 0.9s ease forwards; }
  h1.lit{ text-shadow:0 0 18px rgba(224,164,88,0.55); }

  .tagline{
    font-size:16px;
    font-weight:400;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 0 40px;
    opacity:0;
  }
  .tagline.show{ animation:fadeUp 0.9s ease forwards; }
  .tagline .dash{
    width:22px;
    height:1px;
    background:var(--ink-soft);
    opacity:0.5;
  }
  .cta-group{
    display:flex;
    gap:14px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .cta{
    display:inline-block;
    background:var(--olive-deep);
    color:var(--paper);
    font-family:'Vazirmatn',sans-serif;
    font-size:16px;
    font-weight:500;
    padding:15px 42px;
    border-radius:50px;
    text-decoration:none;
    letter-spacing:0.02em;
    border:none;
    cursor:pointer;
    transition:background 0.3s ease, transform 0.2s ease, box-shadow 1.4s ease;
    opacity:0;
    box-shadow:0 0 0 rgba(224,164,88,0);
  }
  .cta.show{ animation:fadeUp 0.9s ease forwards; }
  .cta.lit{ box-shadow:0 0 22px rgba(224,164,88,0.45); }
  .cta:hover{
    background:var(--olive);
    transform:translateY(-1px);
  }
  .cta-ghost{
    display:inline-block;
    background:rgba(255,252,244,0.6);
    border:1.5px solid var(--ink-soft);
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    font-size:15px;
    font-weight:500;
    padding:14px 34px;
    border-radius:50px;
    text-decoration:none;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
    opacity:0;
  }
  .cta-ghost.show{ animation:fadeUp 0.9s ease 0.15s forwards; }
  .cta-ghost:hover{
    border-color:var(--olive);
    color:var(--olive);
    transform:translateY(-1px);
  }
  @media (max-width:480px){
    .cta-group{ flex-direction:column; }
    .cta, .cta-ghost{ width:100%; text-align:center; padding-left:20px; padding-right:20px; }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .mark{
    position:fixed;
    top:28px;
    right:36px;
    font-size:13px;
    color:var(--ink-soft);
    opacity:0.55;
    letter-spacing:0.15em;
    z-index:1;
  }
  .login-link{
    position:fixed;
    top:26px;
    left:36px;
    font-size:13px;
    font-weight:400;
    color:var(--ink-soft);
    opacity:0;
    letter-spacing:0.04em;
    z-index:1;
    text-decoration:none;
    border-bottom:1px solid rgba(92,84,66,0.35);
    padding-bottom:1px;
    transition:color 0.2s ease, border-color 0.2s ease;
  }
  .login-link:hover{color:var(--olive);border-color:var(--olive);}
  .login-link.show{animation:fadeUp 0.9s ease 3.5s forwards;}
</style>
</head>

    <h1>فانوس</h1>
    <div class="tagline">
      <span class="dash"></span>
      یادگیری از طریق تجربه و تفکر
      <span class="dash"></span>
    </div>
    <div class="cta-group">
      <a href="about.html" class="cta-ghost">فانوس چیه و چطور کار می‌کنه؟</a>
      <a href="auth.html" class="cta">شروع سفر</a>
    </div>
  </div>
  <a href="auth.html?mode=login" class="login-link" id="loginLink">ورود به حساب</a>

  <script>
    (function(){
      var path = document.querySelector('.lantern-path');
      var pencil = document.querySelector('.pencil');
      var glow = document.querySelector('.flame-glow');
      var reflection = document.querySelector('.flame-reflection');
      var flameShape = document.querySelector('.flame-shape');
      var spark = document.querySelector('.spark');
      var particles = document.querySelector('.particles');
      var warmOverlay = document.querySelector('.warm-overlay');
      var h1 = document.querySelector('h1');
      var tagline = document.querySelector('.tagline');
      var cta = document.querySelector('.cta');
      var ctaGhost = document.querySelector('.cta-ghost');

      var fullD = path.getAttribute('d');
      var len = path.getTotalLength();

      // مسیر از چند بخش (چند ضربه‌قلم) تشکیل شده؛ بخش اول خطوط اصلی بدنه‌ی فانوسه
      // و بخش‌های کوچک بعدی فقط جزئیات ریز شیارهای دستی هستن.
      // این‌جا فقط طول همون بخش اول رو جدا اندازه می‌گیریم تا مداد فقط همون رو دنبال کنه.
      var chunks = fullD.match(/[Mm][^Mm]*/g) || [fullD];
      var mainLen = len;
      if (chunks.length > 1){
        var measure = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        measure.setAttribute('d', chunks[0]);
        measure.style.display = 'none';
        path.parentNode.appendChild(measure);
        mainLen = measure.getTotalLength();
        measure.parentNode.removeChild(measure);
      }

      path.style.strokeDasharray = len + ' ' + len;
      path.style.strokeDashoffset = len;

      var startDelay = 250;   // مکث کوتاه قبل از شروع کشیدن
      var drawDuration = 3800; // مدت زمان کشیدنِ خطوط اصلی بدنه (کمی کندتر)
      var startTime = null;

      function easeInOutQuad(t){
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      function tick(ts){
        if (startTime === null) startTime = ts;
        var elapsed = ts - startTime - startDelay;

        if (elapsed < 0){
          requestAnimationFrame(tick);
          return;
        }

        var t = Math.min(elapsed / drawDuration, 1);
        var eased = easeInOutQuad(t);
        var currentLength = mainLen * eased;

        path.style.strokeDashoffset = (len - currentLength).toString();

        var point = path.getPointAtLength(currentLength);
        var lookahead = path.getPointAtLength(Math.min(currentLength + 1.5, mainLen));
        var angle = Math.atan2(lookahead.y - point.y, lookahead.x - point.x) * 180 / Math.PI;
        pencil.setAttribute('transform', 'translate(' + point.x.toFixed(2) + ',' + point.y.toFixed(2) + ') rotate(' + (angle + 55).toFixed(1) + ')');

        if (t < 1){
          requestAnimationFrame(tick);
        } else {
          onOutlineComplete();
        }
      }

      pencil.classList.add('active');
      requestAnimationFrame(tick);

      function onOutlineComplete(){
        // ۱. مداد از صحنه خارج می‌شود
        pencil.classList.add('exit');

        // ۲. جزئیات ریزِ باقی‌مانده (شیارهای کوچک) بی‌سروصدا و بدون دنبال‌کردنِ مداد ظاهر می‌شوند
        path.style.transition = 'stroke-dashoffset 0.35s ease';
        path.style.strokeDashoffset = '0';

        onDrawComplete();
      }

      function onDrawComplete(){
        // ۱. مکث کوتاه، سپس جرقه‌ی اولیه
        setTimeout(function(){
          spark.classList.add('active');
        }, 550);

        // ۲. شعله به‌آرامی شکل می‌گیرد
        setTimeout(function(){
          flameShape.classList.add('active');
        }, 700);

        // ۳. هاله‌ی نور و بازتاب آن روی فانوس
        setTimeout(function(){
          glow.classList.add('lit');
          reflection.classList.add('active');
          warmOverlay.classList.add('active');
          h1.classList.add('lit');
          cta.classList.add('lit');
        }, 1250);

        // ۴. ذرات نور شناور می‌شوند
        setTimeout(function(){
          particles.classList.add('active');
        }, 1500);

        // ۵. عنوان، شعار و دکمه به ترتیب ظاهر می‌شوند
        setTimeout(function(){ h1.classList.add('show'); }, 1650);
        setTimeout(function(){ tagline.classList.add('show'); }, 2050);
        setTimeout(function(){ cta.classList.add('show'); }, 2400);
        setTimeout(function(){ ctaGhost.classList.add('show'); }, 2550);
        setTimeout(function(){ document.getElementById('loginLink').classList.add('show'); }, 2800);
      }
    })();
  </script>
