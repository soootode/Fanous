<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فانوس — بازیابی رمز عبور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f0e8;
    --ink:#2c2820;
    --ink-soft:#5c5442;
    --ink-faint:#9a8e7a;
    --olive:#47502f;
    --olive-deep:#363c22;
    --flame:#e0a458;
    --flame-soft:rgba(224,164,88,0.18);
    --grid-line:rgba(200,180,140,0.45);
    --error:#b5533f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:32px 32px;
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 25%, rgba(255,252,240,0.7) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  .top-logo{
    position:fixed;
    top:28px; right:0; left:0;
    text-align:center;
    z-index:2;
  }
  .top-logo a{
    font-size:18px;
    font-weight:700;
    color:var(--olive);
    text-decoration:none;
    letter-spacing:0.04em;
  }

  .frame{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    opacity:0;
    transform:translateY(16px);
    animation:fadeUp 0.7s ease 0.1s forwards;
  }

  .card{
    background:rgba(255,252,244,0.82);
    backdrop-filter:blur(6px);
    border:1px solid rgba(200,180,140,0.45);
    border-radius:16px;
    padding:40px 36px 32px;
    box-shadow:0 20px 60px rgba(44,40,32,0.06);
  }

  .heading{ text-align:center; margin-bottom:28px; }
  .heading h1{
    font-size:22px;
    font-weight:700;
    color:var(--olive);
    margin-bottom:8px;
  }
  .heading p{
    font-size:13.5px;
    color:var(--ink-faint);
    line-height:1.7;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    text-align:right;
    margin-bottom:16px;
  }
  .field label{
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .field-input-wrap{ position:relative; }
  .field input{
    width:100%;
    font-family:'Vazirmatn',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:rgba(255,252,244,0.9);
    border:1px solid rgba(200,180,140,0.5);
    border-radius:10px;
    padding:13px 16px;
    outline:none;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
    text-align:right;
    direction:ltr;
  }
  .field input::placeholder{ color:var(--ink-faint); }
  .field input:focus{
    border-color:rgba(71,80,47,0.5);
    box-shadow:0 0 0 3px rgba(71,80,47,0.07);
  }
  .field input.error{
    border-color:rgba(181,83,63,0.6);
    box-shadow:0 0 0 3px rgba(181,83,63,0.08);
  }
  .field-msg{
    font-size:12px;
    color:var(--error);
    min-height:14px;
    display:none;
  }
  .field-msg.show{ display:block; }

  .pass-toggle{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-faint);
    padding:4px;
    display:flex;
    align-items:center;
  }
  .pass-toggle:hover{ color:var(--olive); }

  .submit-btn{
    width:100%;
    background:var(--olive-deep);
    color:var(--paper);
    font-family:'Vazirmatn',sans-serif;
    font-size:15.5px;
    font-weight:500;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:background 0.25s ease, transform 0.2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .submit-btn:hover{ background:var(--olive); }
  .submit-btn:active{ transform:scale(0.98); }
  .submit-btn:disabled{ opacity:0.7; cursor:default; }

  .spinner{
    width:15px; height:15px;
    border:2px solid rgba(245,240,232,0.35);
    border-top-color:var(--paper);
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
  }
  .submit-btn.loading .spinner{ display:inline-block; }
  .submit-btn.loading .btn-label{ display:none; }

  .form-error-banner{
    display:none;
    background:rgba(181,83,63,0.08);
    border:1px solid rgba(181,83,63,0.25);
    color:var(--error);
    font-size:13px;
    padding:11px 14px;
    border-radius:8px;
    margin-bottom:16px;
    text-align:right;
    line-height:1.6;
  }
  .form-error-banner.show{ display:block; }

  .back-home{
    position:fixed;
    bottom:24px; right:0; left:0;
    text-align:center;
    z-index:2;
  }
  .back-home a{
    font-size:12.5px;
    color:var(--ink-faint);
    text-decoration:none;
    transition:color 0.2s ease;
  }
  .back-home a:hover{ color:var(--olive); }

  /* حالت موفقیت / لینک نامعتبر */
  .state-view{
    display:none;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
    padding:20px 0 6px;
  }
  .state-view.show{ display:flex; animation:fadeUp 0.5s ease forwards; }
  .state-view h2{ font-size:19px; color:var(--olive); font-weight:700; }
  .state-view p{ font-size:13.5px; color:var(--ink-soft); line-height:1.75; max-width:300px; }
  .state-view.bad h2{ color:var(--error); }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  @media (max-width:480px){
    .card{ padding:32px 24px 26px; }
  }
</style>
</head>
<body>

<div class="top-logo"><a href="index.html">فانوس</a></div>

<div class="frame">
  <div class="card">

    <div id="resetFormView">
      <div class="heading">
        <h1>رمز عبور جدید</h1>
        <p>یه رمز تازه برای حسابت انتخاب کن — حداقل ۸ کاراکتر.</p>
      </div>

      <div class="form-error-banner" id="resetBanner"></div>

      <form id="resetForm" onsubmit="return handleReset(event)" novalidate>
        <div class="field">
          <label for="rp-pass">رمز عبور جدید</label>
          <div class="field-input-wrap">
            <input type="password" id="rp-pass" placeholder="حداقل ۸ کاراکتر" autocomplete="new-password"/>
            <button type="button" class="pass-toggle" onclick="togglePass('rp-pass', this)"></button>
          </div>
          <span class="field-msg" id="rp-pass-msg"></span>
        </div>
        <div class="field">
          <label for="rp-pass2">تکرار رمز عبور</label>
          <div class="field-input-wrap">
            <input type="password" id="rp-pass2" placeholder="همون رمز رو دوباره بنویس" autocomplete="new-password"/>
            <button type="button" class="pass-toggle" onclick="togglePass('rp-pass2', this)"></button>
          </div>
          <span class="field-msg" id="rp-pass2-msg"></span>
        </div>

        <button type="submit" class="submit-btn" id="resetBtn">
          <span class="spinner"></span>
          <span class="btn-label">ثبت رمز جدید</span>
        </button>
      </form>
    </div>

    <!-- موفقیت -->
    <div class="state-view" id="resetSuccess">
      <svg viewBox="0 0 40 40" fill="none" width="42" height="42"><circle cx="20" cy="20" r="18" stroke="#47502f" stroke-width="1.4"/><path d="M12 20 L17 25 L28 14" stroke="#e0a458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>رمزت عوض شد!</h2>
      <p>حالا با همون ایمیل و رمز جدید وارد شو.</p>
    </div>

    <!-- لینک نامعتبر -->
    <div class="state-view bad" id="invalidLink">
      <svg viewBox="0 0 40 40" fill="none" width="42" height="42"><circle cx="20" cy="20" r="18" stroke="#b5533f" stroke-width="1.4"/><path d="M13 13 L27 27 M27 13 L13 27" stroke="#b5533f" stroke-width="2" stroke-linecap="round"/></svg>
      <h2>لینک نامعتبره</h2>
      <p>این لینک بازیابی منقضی شده یا قبلاً استفاده شده. یه درخواست جدید بفرست.</p>
      <a class="submit-btn" style="text-decoration:none;width:auto;padding:12px 34px;" href="auth.html?mode=login"><span class="btn-label">درخواست لینک جدید از صفحه ورود</span></a>
    </div>

  </div>
</div>

<div class="back-home"><a href="index.html">بازگشت به صفحه اصلی</a></div>

<script>
  var API_BASE = 'https://fanous-backend.vercel.app';

  // خواندن توکن از URL — اگر نبود، فرم اصلاً رندر نشود
  var params = new URLSearchParams(window.location.search);
  var resetToken = params.get('token') || '';

  if(!resetToken){
    document.getElementById('resetFormView').style.display = 'none';
    document.getElementById('invalidLink').classList.add('show');
  }

  function togglePass(inputId, btn){
    var inp = document.getElementById(inputId);
    var showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.innerHTML = showing
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.4 19.4 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.35 3.42M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  }
  document.querySelectorAll('.pass-toggle').forEach(function(btn){
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.4 19.4 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.5 19.5 0 0 1-2.35 3.42M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  });

  function setFieldError(inputId, msgId, message){
    document.getElementById(inputId).classList.add('error');
    var msg = document.getElementById(msgId);
    msg.textContent = message;
    msg.classList.add('show');
  }
  function clearFieldError(inputId, msgId){
    document.getElementById(inputId).classList.remove('error');
    var msg = document.getElementById(msgId);
    msg.textContent = '';
    msg.classList.remove('show');
  }

  function handleReset(e){
    e.preventDefault();
    document.getElementById('resetBanner').classList.remove('show');
    clearFieldError('rp-pass', 'rp-pass-msg');
    clearFieldError('rp-pass2', 'rp-pass2-msg');

    var pass = document.getElementById('rp-pass').value;
    var pass2 = document.getElementById('rp-pass2').value;
    var ok = true;

    if(!pass){ setFieldError('rp-pass','rp-pass-msg','رمز جدید رو وارد کن'); ok = false; }
    else if(pass.length < 8){ setFieldError('rp-pass','rp-pass-msg','رمز باید حداقل ۸ کاراکتر باشه'); ok = false; }
    if(!pass2){ setFieldError('rp-pass2','rp-pass2-msg','تکرار رمز رو وارد کن'); ok = false; }
    else if(pass && pass !== pass2){ setFieldError('rp-pass2','rp-pass2-msg','دو رمز یکی نیستن'); ok = false; }

    if(!ok) return false;

    var btn = document.getElementById('resetBtn');
    btn.classList.add('loading');
    btn.disabled = true;

    fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: resetToken, new_password: pass })
    })
      .then(function(res){
        return res.json().then(function(data){ return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function(result){
        btn.classList.remove('loading');
        btn.disabled = false;
        if(!result.ok){
          if(result.status === 400){
            // توکن منقضی/نامعتبر
            document.getElementById('resetFormView').style.display = 'none';
            document.getElementById('invalidLink').classList.add('show');
            return;
          }
          var el = document.getElementById('resetBanner');
          el.textContent = (result.data && result.data.detail) || 'مشکلی پیش اومد، دوباره امتحان کن.';
          el.classList.add('show');
          return;
        }
        document.getElementById('resetFormView').style.display = 'none';
        document.getElementById('resetSuccess').classList.add('show');
        setTimeout(function(){ window.location.href = 'auth.html?mode=login'; }, 1600);
      })
      .catch(function(){
        btn.classList.remove('loading');
        btn.disabled = false;
        var el2 = document.getElementById('resetBanner');
        el2.textContent = 'اتصال به سرور برقرار نشد — دوباره امتحان کن.';
        el2.classList.add('show');
      });

    return false;
  }
</script>
</body>
</html>
